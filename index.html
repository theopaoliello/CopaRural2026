<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa Rural Ervália 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#ffffff; --bg2:#f5f5f4; --border:#e5e5e4; --border2:#d0d0ce;
  --text:#1a1a18; --text2:#6b6b69; --blue:#185FA5; --green:#4a8a10;
  --red:#d63b3a; --gold:#fac775; --radius:10px; --radius-sm:6px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1c1c1a; --bg2:#252523; --border:#333331; --border2:#3d3d3b;
         --text:#f0f0ee; --text2:#888886; --green:#7ec94a; --red:#f06060; }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
.container{max-width:860px;margin:0 auto;padding:0 12px 48px;}
.header{display:flex;align-items:center;gap:12px;padding:20px 0 18px;}
.trophy-icon { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.trophy-icon img { width: 100%; height: 100%; object-fit: contain; }
.header-title{font-size:20px;font-weight:700;}
.header-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{padding:9px 12px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color .15s;flex-shrink:0;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.section{display:none;}.section.active{display:block;}
.group-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.tag-a{background:#deeaf8;color:#0a3d6e;} .tag-b{background:#ddf0cc;color:#1e4a08;} .tag-all{background:#fde9c8;color:#6b3500;}
@media(prefers-color-scheme:dark){.tag-a{background:#0f2e4f;color:#7db8ed;}.tag-b{background:#142e07;color:#8cc95a;}.tag-all{background:#3d1f00;color:#f5b35a;}}
.group-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
thead th{padding:8px 5px;text-align:center;font-weight:600;font-size:11px;color:var(--text2);background:var(--bg2);border-bottom:1px solid var(--border);white-space:nowrap;}
thead th.th-name{text-align:left;padding-left:4px;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--bg2);}
tbody td{padding:8px 5px;text-align:center;white-space:nowrap;}
td.td-name{text-align:left;font-weight:600;font-size:13px;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.w-pos {width:30px;} .w-pts{width:32px;} .w-n{width:26px;} .w-sg{width:32px;} .w-forma{width:52px;} .w-gr{width:30px;}
.pts-cell{font-weight:700;color:var(--blue);}
.sg-pos{color:var(--green);font-weight:500;} .sg-neg{color:var(--red);font-weight:500;} .sg-zer{color:var(--text2);}
.pos-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;}
.pos-1{background:var(--gold);color:#412402;} .pos-2{background:#d0cec4;color:#2a2a28;} .pos-3{background:#f0b89e;color:#450d00;}
.pos-num{font-size:12px;color:var(--text2);}
.zona-camp {background:rgba(250,199,117,.12);}
.zona-class{background:rgba(24,95,165,.07);}
@media(prefers-color-scheme:dark){.zona-camp{background:rgba(250,199,117,.09);}.zona-class{background:rgba(24,95,165,.11);}}
.form-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 1px;}
.fv{background:var(--green);} .fe{background:#999997;} .fd{background:var(--red);}
.filter-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.filter-btn{font-size:12px;font-weight:500;padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:none;cursor:pointer;color:var(--text2);transition:all .15s;}
.filter-btn:hover{border-color:var(--blue);color:var(--blue);}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.round-section{margin-bottom:18px;}
.round-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px;}
.match-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;margin-bottom:6px;}
.match-card.clickable{cursor:pointer;transition:border-color .15s,background .15s;}
.match-card.clickable:hover{border-color:var(--blue);background:var(--bg2);}
.match-goals-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.match-goals-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
.match-goal-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;color:var(--text);}
.match-goal-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.match-goal-row strong{color:var(--blue);flex-shrink:0;}
.match-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.match-body{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.match-team{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.match-team.right{text-align:right;}.match-team.winner{color:var(--blue);}
.score-box{display:flex;align-items:center;gap:5px;background:var(--bg2);border-radius:var(--radius-sm);padding:5px 12px;flex-shrink:0;}
.score-num{font-size:17px;font-weight:700;}.score-num.winner{color:var(--blue);}
.score-sep{font-size:13px;color:var(--text2);}
.match-vs{font-size:12px;color:var(--text2);background:var(--bg2);border-radius:var(--radius-sm);padding:5px 14px;flex-shrink:0;font-weight:500;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.badge-ok{background:#ddf0cc;color:#1e4a08;} .badge-pend{background:#e8e8e6;color:#555553;}
@media(prefers-color-scheme:dark){.badge-ok{background:#142e07;color:#8cc95a;}.badge-pend{background:#333331;color:#999997;}}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:3px;}
.stat-value{font-size:26px;font-weight:700;}
.top-match{font-size:12px;color:var(--text2);background:var(--bg2);padding:9px 12px;border-radius:var(--radius-sm);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.top-match strong{color:var(--text);}
.section-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.scorers-list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.scorer-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);}
.scorer-row:last-child{border-bottom:none;}
.scorer-rank{font-size:12px;font-weight:600;color:var(--text2);width:18px;flex-shrink:0;}
.scorer-info{flex:1;min-width:0;}
.scorer-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scorer-team{font-size:11px;color:var(--text2);}
.scorer-bar-wrap{flex:1;max-width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0;}
.scorer-bar-fill{height:100%;background:var(--blue);border-radius:2px;}
.scorer-goals{font-size:13px;font-weight:700;color:var(--blue);min-width:24px;text-align:right;}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--text2);background:var(--bg2);border-radius:var(--radius);}
.empty-state i{font-size:30px;display:block;margin-bottom:8px;}
.empty-state p{font-size:13px;}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.team-card{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px;cursor:pointer;text-align:left;color:var(--text);transition:background .15s,border-color .15s;}
.team-card:hover{background:var(--bg2);border-color:var(--blue);}
.team-crest-sm{width:42px;height:42px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--text2);}
.team-crest-sm img,.team-crest-lg img{width:100%;height:100%;object-fit:cover;}
.team-card-name{font-size:14px;font-weight:700;}
.team-card-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.team-detail-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.team-crest-lg{width:74px;height:74px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--text2);}
.team-detail-title{font-size:20px;font-weight:700;margin-bottom:5px;}
.team-photo{width:100%;height:260px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.team-photo img{width:100%;height:100%;object-fit:cover;}
.players-list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.player-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);}
.player-row:last-child{border-bottom:none;}
.player-goals{font-size:12px;font-weight:700;color:var(--blue);}
.back-btn{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;font-weight:700;margin-bottom:12px;padding:0;}
.file-input{max-width:210px;}
.admin-gate{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;max-width:320px;margin:0 auto;text-align:center;}
.lock-icon{width:48px;height:48px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;}
.lock-icon i{font-size:22px;color:var(--text2);}
.admin-gate h3{font-size:16px;font-weight:600;margin-bottom:6px;}
.admin-gate p.sub{font-size:13px;color:var(--text2);margin-bottom:1.25rem;}
.admin-panel{display:flex;flex-direction:column;gap:12px;}
.admin-header{display:flex;justify-content:space-between;align-items:center;}
.admin-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.admin-menu-btn{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:left;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .15s;}
.admin-menu-btn i{font-size:18px;color:var(--blue);}
.admin-menu-btn:hover,.admin-menu-btn.active{border-color:var(--blue);background:rgba(24,95,165,.08);}
@media(max-width:520px){.admin-menu{grid-template-columns:1fr;}}
.admin-status{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.admin-status i{color:var(--green);}
.panel-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;}
.panel-card h3{font-size:13px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:7px;}
.form-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:11px;font-weight:500;color:var(--text2);}
input,select{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:7px 10px;font-size:13px;outline:none;transition:border-color .15s;}
input:focus,select:focus{border-color:var(--blue);}
.btn{background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn:hover{opacity:.85;}.btn-full{width:100%;margin-top:4px;}
.logout-btn{font-size:12px;color:var(--text2);background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;font-weight:500;}
.logout-btn:hover{background:var(--bg2);}
.legend{font-size:11px;color:var(--text2);margin-top:8px;padding-left:2px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.legend span{display:flex;align-items:center;gap:4px;}
.ad-banner{display:block;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:0 0 18px;background:var(--bg2);}
.ad-banner img{display:block;width:100%;height:auto;max-height:180px;object-fit:cover;}
.toast{position:fixed;bottom:20px;right:16px;left:16px;max-width:320px;margin:0 auto;background:#1D9E75;color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2);text-align:center;}
.toast.show{opacity:1;}
</style>

  const PLAYERS_DATA = buildOfficialPlayers();

  const defaultState = {
    teams: TEAMS.map(t=>({...t})),
    players: [...PLAYERS_DATA],
    matches: SEED.map((s,i)=>{
      const hid=TEAMS.find(t=>t.name.toLowerCase()===s.home.toLowerCase())?.id;
      const aid=TEAMS.find(t=>t.name.toLowerCase()===s.away.toLowerCase())?.id;
      const isPlayed = s.hs !== null && s.hs !== undefined;
      return {id:i+1,home:hid,away:aid,homeScore:s.hs,awayScore:s.as,played:isPlayed,round:s.r,date:s.date};
    }),
    adBannerUrl: '',
    adBannerLink: ''
  };

  let state = JSON.parse(JSON.stringify(defaultState));

  // 3. CONEXÃO COM O FIREBASE
  const campeonatoRef = ref(db, 'campeonato/');
  
  function normalizeState(data){
    const base=JSON.parse(JSON.stringify(defaultState));
    const normalized={...base,...(data||{})};
    const teamIds=new Set((normalized.teams||[]).filter(Boolean).map(t=>Number(t.id)));
    normalized.teams=(normalized.teams||[]).filter(t=>t&&teamIds.has(Number(t.id))).map(t=>({
      ...t,
      id:Number(t.id),
      crestUrl:safeImage(t.crestUrl,MAX_TEAM_IMAGE_CHARS),
      photoUrl:safeImage(t.photoUrl,MAX_TEAM_IMAGE_CHARS)
    }));
    normalized.players=(normalized.players||[]).filter(p=>p&&typeof p.name==='string'&&teamIds.has(Number(p.teamId))).map(p=>({
      ...p,
      id:Number(p.id),
      teamId:Number(p.teamId),
      goals:Number(p.goals)||0
    }));
    normalized.matches=(normalized.matches||[]).filter(m=>m&&teamIds.has(Number(m.home))&&teamIds.has(Number(m.away))).map(m=>({
      ...m,
      id:Number(m.id),
      home:Number(m.home),
      away:Number(m.away),
      homeScore:m.homeScore==null?m.homeScore:Number(m.homeScore),
      awayScore:m.awayScore==null?m.awayScore:Number(m.awayScore),
      played:Boolean(m.played),
      goals:Array.isArray(m.goals)?m.goals.filter(g=>g&&teamIds.has(Number(g.teamId))&&Number(g.playerId)&&Number(g.goals)>0).map(g=>({
        playerId:Number(g.playerId),
        teamId:Number(g.teamId),
        name:String(g.name||''),
        goals:Number(g.goals)||0
      })):[]
    }));
    normalized.adBannerUrl=safeImage(normalized.adBannerUrl);
    normalized.adBannerLink=normalizeAdLink(normalized.adBannerLink);
    return normalized;
  }

  onValue(campeonatoRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state = normalizeState(data);
    } else {
      set(campeonatoRef, defaultState);
      state = JSON.parse(JSON.stringify(defaultState));
    }
    renderAll();
  });

  // Funções de ajuda
  function tById(id){return state.teams.find(t=>t.id===id)||{};}
  function tName(id){return tById(id).name||'?';}
  function tGroup(id){return tById(id).group||'';}
  
  function calcTable(ids){
    ids=ids||state.teams.map(t=>t.id);
    const rows=state.teams.filter(t=>ids.includes(t.id)).map(t=>({id:t.id,name:t.name,group:t.group,pj:0,v:0,e:0,d:0,gp:0,gc:0,pts:0,form:[]}));
    const byId=Object.fromEntries(rows.map(r=>[r.id,r]));
    state.matches.filter(m=>m.played&&ids.includes(m.home)&&ids.includes(m.away)).forEach(m=>{
      const h=byId[m.home],a=byId[m.away];if(!h||!a)return;
      h.pj++;a.pj++;h.gp+=m.homeScore;h.gc+=m.awayScore;a.gp+=m.awayScore;a.gc+=m.homeScore;
      if(m.homeScore>m.awayScore){h.v++;h.pts+=3;h.form.push('V');a.d++;a.form.push('D');}
      else if(m.homeScore===m.awayScore){h.e++;h.pts++;h.form.push('E');a.e++;a.pts++;a.form.push('E');}
      else{a.v++;a.pts+=3;a.form.push('V');h.d++;h.form.push('D');}
    });
    return rows.sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp||a.name.localeCompare(b.name));
  }

  function buildTable(rows,showGroup){
    // Alterado o título da coluna de "Forma" para "Últ.Jogos"
    const head=`<thead><tr>
      <th class="w-pos">#</th><th class="th-name">Time</th>
      <th class="w-pts" title="Pontos">Pts</th><th class="w-n" title="Partidas">PJ</th>
      <th class="w-n" title="Vitórias">V</th><th class="w-n" title="Empates">E</th>
      <th class="w-n" title="Derrotas">D</th><th class="w-n" title="Gols pró">GP</th>
      <th class="w-n" title="Gols contra">GC</th><th class="w-sg" title="Saldo">SG</th>
      <th class="w-forma" title="Últimos 5 jogos">Últ.Jogos</th>
    </tr></thead>`;
    
    const body=rows.map((r,i)=>{
      const pos=i+1;
      let rowClass='';
      if(showGroup){if(pos===1) rowClass='zona-camp'; else if(pos<=9) rowClass='zona-class';}
      const posEl=`<span class="pos-num">${pos}</span>`;
      
      // Alterado de slice(-6) para slice(-5) para pegar apenas os últimos 5 jogos
      const form=r.form.slice(-5).map(f=>`<span class="form-dot f${f.toLowerCase()}"></span>`).join('');
      
      const sg=r.gp-r.gc,sgC=sg>0?'sg-pos':sg<0?'sg-neg':'sg-zer';
      return `<tr class="${rowClass}">
        <td class="w-pos">${posEl}</td><td class="td-name">${r.name}</td>
        <td class="w-pts pts-cell">${r.pts}</td><td class="w-n">${r.pj}</td>
        <td class="w-n">${r.v}</td><td class="w-n">${r.e}</td><td class="w-n">${r.d}</td>
        <td class="w-n">${r.gp}</td><td class="w-n">${r.gc}</td>
        <td class="w-sg ${sgC}">${sg>0?'+':''}${sg}</td>
        <td class="w-forma">${form||'—'}</td>
      </tr>`;
    }).join('');
    
    return `<div class="table-wrap"><table>${head}<tbody>${body}</tbody></table></div>`;
  }

  function renderClassificacao(){
    const idA=state.teams.filter(t=>t.group==='A').map(t=>t.id);
    const idB=state.teams.filter(t=>t.group==='B').map(t=>t.id);
    const img=safeImage(state.adBannerUrl);
    const link=normalizeAdLink(state.adBannerLink);
    const adBanner=img?`<a class="ad-banner" href="${escapeAttr(link||'#')}" ${link?'target="_blank" rel="noopener noreferrer"':'onclick="return false"'}><img src="${img}" alt="Anúncio"></a>`:'';
    document.getElementById('classificacao').innerHTML=`
      <div class="group-label"><span class="group-tag tag-a">Grupo A</span></div>
      ${buildTable(calcTable(idA),false)}
      <div class="group-label"><span class="group-tag tag-b">Grupo B</span></div>
      ${buildTable(calcTable(idB),false)}
      ${adBanner}
      <div class="group-label"><span class="group-tag tag-all">Classificação Geral</span></div>
      ${buildTable(calcTable(),true)}
      <div class="legend">
        <span><span style="display:inline-block;width:10px;height:10px;background:rgba(250,199,117,.35);border-radius:2px"></span>Vaga direta para final</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:rgba(24,95,165,.2);border-radius:2px"></span>Classificados (#2–#9)</span>
      </div>`;
  }

  function renderResultados(){
    const all=state.matches;
    let ms=filterRes==='todos'?all:filterRes==='A'?all.filter(m=>tGroup(m.home)==='A'&&tGroup(m.away)==='A'):all.filter(m=>tGroup(m.home)==='B'&&tGroup(m.away)==='B');
    if(filterTeam!=='todos'){
      const teamId=Number(filterTeam);
      ms=ms.filter(m=>m.home===teamId||m.away===teamId);
    }
    const rounds=[...new Set(ms.map(m=>m.round))].sort((a,b)=>b-a);
    document.getElementById('resultados').innerHTML=`
      <div class="filter-bar">
        <button class="filter-btn ${filterRes==='todos'?'active':''}" onclick="setFilter('todos')">Todos</button>
        <button class="filter-btn ${filterRes==='A'?'active':''}" onclick="setFilter('A')">Grupo A</button>
        <button class="filter-btn ${filterRes==='B'?'active':''}" onclick="setFilter('B')">Grupo B</button>
        <select onchange="setTeamFilter(this.value)" aria-label="Filtrar por time">
          <option value="todos" ${filterTeam==='todos'?'selected':''}>Todos os times</option>
          ${state.teams.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<option value="${t.id}" ${Number(filterTeam)===t.id?'selected':''}>${t.name}</option>`).join('')}
        </select>
      </div>
      ${rounds.length?rounds.map(r=>{
        const rms=ms.filter(m=>m.round===r);
        const dl=rms[0]?.date?` &nbsp;·&nbsp; ${rms[0].date}`:'';
        return `<div class="round-section"><div class="round-label">Rodada ${r}${dl}</div>
        ${rms.map(m=>{
          const g=tGroup(m.home);
          if(!m.played)return `<div class="match-card"><div class="match-meta"><span class="group-tag tag-${g.toLowerCase()}">Grupo ${g}</span><span class="badge badge-pend">Pendente</span></div><div class="match-body"><div class="match-team">${tName(m.home)}</div><div class="match-vs">vs</div><div class="match-team right">${tName(m.away)}</div></div></div>`;
          const w=m.homeScore>m.awayScore?'home':m.homeScore<m.awayScore?'away':'draw';
          const hasGoals=Array.isArray(m.goals)&&m.goals.length>0;
          const isExpanded=expandedMatchId===m.id;
          const detail=hasGoals&&isExpanded?renderMatchScorersDetail(m):'';
          return `<div class="match-card${hasGoals?' clickable':''}" ${hasGoals?`onclick="toggleMatchGoals(${m.id})" title="Clique para ver os marcadores"`:''}><div class="match-meta"><span class="group-tag tag-${g.toLowerCase()}">Grupo ${g}</span><span class="badge badge-ok">Encerrado${hasGoals?` · ${isExpanded?'ocultar gols':'ver gols'}`:''}</span></div><div class="match-body"><div class="match-team${w==='home'?' winner':''}">${tName(m.home)}</div><div class="score-box"><span class="score-num${w==='home'?' winner':''}">${m.homeScore}</span><span class="score-sep">×</span><span class="score-num${w==='away'?' winner':''}">${m.awayScore}</span></div><div class="match-team right${w==='away'?' winner':''}">${tName(m.away)}</div></div>${detail}</div>`;
        }).join('')}</div>`;
      }).join(''):`<div class="empty-state"><i class="ti ti-ball-football-off"></i><p>Nenhum jogo encontrado para este filtro.</p></div>`}`;
  }

  function renderMatchScorersDetail(match){
    const byTeam=[match.home,match.away].map(teamId=>{
      const rows=(match.goals||[]).filter(g=>g.teamId===teamId).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
      if(!rows.length)return '';
      return `<div><div class="match-goals-title">${escapeAttr(tName(teamId))}</div>${rows.map(g=>`<div class="match-goal-row"><span>${escapeAttr(g.name)}</span><strong>${g.goals} gol${g.goals>1?'s':''}</strong></div>`).join('')}</div>`;
    }).filter(Boolean).join('');
    return `<div class="match-goals-detail">${byTeam}</div>`;
  }

  function toggleMatchGoals(matchId){
    expandedMatchId=expandedMatchId===matchId?null:matchId;

  }

  function renderEstatisticas(){

  function formatGoalLines(match,teamId){

  function updateMatchGoalTeams(){
    const {match}=getMatchGoalFormMatch();
    const homeLabel=document.getElementById('match-goals-home-label');
    const awayLabel=document.getElementById('match-goals-away-label');
    const homeInput=document.getElementById('match-goals-home');
    const awayInput=document.getElementById('match-goals-away');
    const preview=document.getElementById('match-goals-preview');
    if(!match||!homeLabel||!awayLabel||!homeInput||!awayInput)return;
    homeLabel.textContent=tName(match.home);
    awayLabel.textContent=tName(match.away);
    homeInput.value=formatGoalLines(match,match.home);
    awayInput.value=formatGoalLines(match,match.away);
    if(preview)preview.innerHTML='<p>Selecione uma partida e teste o envio antes de salvar.</p>';
  }

  function parseTeamGoalLines(teamId,text){
    const errors=[];
    const grouped=new Map();
    String(text||'').split('\n').forEach((rawLine,index)=>{
      const line=rawLine.trim();
      if(!line)return;
      const match=line.match(/^(.+?)\s+(\d+)$/);
      if(!match){
        errors.push(`Linha ${index+1}: use o formato "Nome do jogador 2".`);
        return;
      }
      const name=match[1].trim();
      const goals=Number(match[2]);
      if(!name||!Number.isInteger(goals)||goals<=0){
        errors.push(`Linha ${index+1}: quantidade de gols inválida.`);
        return;
      }
      const player=state.players.find(p=>p.teamId===teamId&&normalizeText(p.name)===normalizeText(name));
      if(!player){
        errors.push(`Linha ${index+1}: jogador "${name}" não encontrado em ${tName(teamId)}.`);
        return;
      }
      const current=grouped.get(player.id)||{playerId:player.id,teamId,name:player.name,goals:0};
      current.goals+=goals;
      grouped.set(player.id,current);
    });
    const entries=[...grouped.values()];
    return {entries,errors,totalGoals:entries.reduce((sum,g)=>sum+g.goals,0)};
  }

  function buildMatchGoalPayload(){
    const {matchIndex,match}=getMatchGoalFormMatch();
    if(!match)return {errors:['Selecione uma partida válida.']};
    const home=parseTeamGoalLines(match.home,document.getElementById('match-goals-home')?.value);
    const away=parseTeamGoalLines(match.away,document.getElementById('match-goals-away')?.value);
    const goals=[...home.entries,...away.entries];
    return {matchIndex,match,home,away,goals,homeScore:home.totalGoals,awayScore:away.totalGoals,errors:[...home.errors,...away.errors]};
  }

  function renderMatchGoalPreview(payload){
    const el=document.getElementById('match-goals-preview');
    if(!el)return;
    if(payload.errors?.length){
      el.innerHTML=`<div style="text-align:left;color:var(--red)"><strong>Corrija antes de enviar:</strong><ul>${payload.errors.map(e=>`<li>${escapeAttr(e)}</li>`).join('')}</ul></div>`;
      return;
    }
    const rows=payload.goals.length?payload.goals.map(g=>`<div class="scorer-row"><div class="scorer-info"><div class="scorer-name">${escapeAttr(g.name)}</div><div class="scorer-team">${escapeAttr(tName(g.teamId))}</div></div><div class="scorer-goals">${g.goals}</div></div>`).join(''):'<p>Nenhum gol registrado. O placar será 0×0.</p>';
    el.innerHTML=`<div style="text-align:left;width:100%"><div class="top-match" style="margin-top:0"><strong>${escapeAttr(tName(payload.match.home))} ${payload.homeScore}×${payload.awayScore} ${escapeAttr(tName(payload.match.away))}</strong></div><div class="scorers-list">${rows}</div></div>`;
  }

  function previewMatchGoalSubmit(){

  function applyGoalDelta(players,goals,sign){
    goals.forEach(goal=>{
      const player=players.find(p=>p.id===goal.playerId);
      if(player)player.goals=Math.max(0,(Number(player.goals)||0)+(sign*goal.goals));
    });
  }

  async function submitMatchGoalResult(){
    const payload=buildMatchGoalPayload();
    renderMatchGoalPreview(payload);
    if(payload.errors?.length){showToast('Corrija os erros antes de enviar.');return;}
    const players=state.players.map(p=>({...p,goals:Number(p.goals)||0}));
    if(Array.isArray(payload.match.goals)&&payload.match.goals.length)applyGoalDelta(players,payload.match.goals,-1);
    applyGoalDelta(players,payload.goals,1);
    try{
      await update(campeonatoRef, {
        [`matches/${payload.matchIndex}/homeScore`]: payload.homeScore,
        [`matches/${payload.matchIndex}/awayScore`]: payload.awayScore,
        [`matches/${payload.matchIndex}/played`]: true,
        [`matches/${payload.matchIndex}/goals`]: payload.goals,
        players
      });
      state.players=players;
      state.matches[payload.matchIndex]={...payload.match,homeScore:payload.homeScore,awayScore:payload.awayScore,played:true,goals:payload.goals};
      showToast('Resultado e artilharia salvos!');
      renderAll();
    }catch(error){
      console.error('Erro ao salvar gols da partida:', error);
      showToast(error?.message||'Erro ao salvar gols da partida');
    }
  }

  const MAX_IMAGE_CHARS=220000;
  const MAX_TEAM_IMAGE_CHARS=90000;
  function safeImage(src,maxChars=MAX_IMAGE_CHARS){return typeof src==='string'&&src.startsWith('data:image/')&&src.length<=maxChars?src:'';}
  function escapeAttr(value){return String(value??'').replace(/[&"<>]/g,ch=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[ch]));}
  function normalizeAdLink(link){
    const value=typeof link==='string'?link.trim():'';
    if(!value)return '';
    if(/^https?:\/\//i.test(value))return value;
    return `https://${value}`;
  }
  function imageFileToDataUrl(file, maxSize=520, quality=0.62, maxChars=MAX_TEAM_IMAGE_CHARS){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          let scale=Math.min(1, maxSize/Math.max(img.width,img.height));
          const canvas=document.createElement('canvas');
          const ctx=canvas.getContext('2d');
          const makeData=(q)=>{
            canvas.width=Math.max(1,Math.round(img.width*scale));
            canvas.height=Math.max(1,Math.round(img.height*scale));
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(img,0,0,canvas.width,canvas.height);
            return canvas.toDataURL('image/jpeg',q);
          };
          let data=makeData(quality);
          while(data.length>maxChars&&scale>0.2){
            scale*=0.75;
            data=makeData(0.55);
          }
          if(data.length>maxChars)return reject(new Error('Imagem muito grande. Use uma imagem menor.'));
          resolve(data);
        };
        img.onerror=()=>reject(new Error('Não foi possível ler a imagem'));
        img.src=reader.result;
      };
      reader.onerror=()=>reject(new Error('Não foi possível abrir o arquivo'));
      reader.readAsDataURL(file);
    });
  }

  async function addGoals(){
    const btn=document.getElementById('add-goals-btn');

      const pid=parseInt(document.getElementById('sel-player').value);

      if(!p||!count)return showToast('Selecione jogador e quantidade');
      if(btn){btn.disabled=true;btn.textContent='Salvando...';}
      const updatedPlayers=state.players.map((player,index)=>index===playerIndex?{...player,goals:(Number(player.goals)||0)+count}:player);
      await set(ref(db, 'campeonato/players'), updatedPlayers);
      state.players=updatedPlayers;
      showToast(`${count>0?'+':''}${count} gol(s) para ${p.name}!`);
    }catch(error){
      console.error('Erro ao adicionar gols:', error);
      showToast(error?.message||'Erro ao salvar gols');
    }finally{
      if(btn){btn.disabled=false;btn.textContent='Adicionar';}
    }
  }

  function normalizeText(value){
    return String(value??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
  }

  async function addBulkGoals(){
    const btn=document.getElementById('bulk-goals-btn');
    const input=document.getElementById('bulk-goals-input');
    try{
      const lines=(input?.value||'').split('\n').map(line=>line.trim()).filter(Boolean);
      if(lines.length<2)return showToast('Informe o time e ao menos um jogador');
      const teamName=lines[0];
      const team=state.teams.find(t=>normalizeText(t.name)===normalizeText(teamName));
      if(!team)return showToast(`Time não encontrado: ${teamName}`);

      const additions=new Map();
      const invalidLines=[];
      const missingPlayers=[];
      for(const line of lines.slice(1)){
        const match=line.match(/^(.*?)\s+(-?\d+)$/);
        if(!match){invalidLines.push(line);continue;}
        const playerName=match[1].trim();
        const count=parseInt(match[2],10);
        if(!playerName||count<=0){invalidLines.push(line);continue;}
        const player=state.players.find(p=>Number(p.teamId)===Number(team.id)&&normalizeText(p.name)===normalizeText(playerName));
        if(!player){missingPlayers.push(playerName);continue;}
        additions.set(player.id,(additions.get(player.id)||0)+count);
      }

      if(invalidLines.length)return showToast(`Linha inválida: ${invalidLines[0]}`);
      if(missingPlayers.length)return showToast(`Jogador não encontrado em ${team.name}: ${missingPlayers[0]}`);
      if(!additions.size)return showToast('Nenhum gol válido para adicionar');

      if(btn){btn.disabled=true;btn.textContent='Salvando...';}
      let totalGoals=0;
      const updatedPlayers=state.players.map(player=>{
        const count=additions.get(player.id)||0;
        if(!count)return player;
        totalGoals+=count;
        return {...player,goals:(Number(player.goals)||0)+count};
      });
      await set(ref(db, 'campeonato/players'), updatedPlayers);
      state.players=updatedPlayers;
      input.value='';
      showToast(`${totalGoals} gol(s) adicionados para ${additions.size} jogador(es)`);
    }catch(error){
      console.error('Erro ao adicionar gols por lista:', error);
      showToast(error?.message||'Erro ao salvar lista de gols');
    }finally{
      if(btn){btn.disabled=false;btn.textContent='Adicionar lista';}
    }
  }

  function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
  
  function openTeam(id){selectedTeamId=id;renderTimes();}
  function backToTeams(){selectedTeamId=null;renderTimes();}

  function showTab(id){
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['classificacao','times','resultados','estatisticas','admin'][i]===id));
    document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));
    renderAll();
  }

  function setFilter(f){filterRes=f;renderResultados();}
  function setTeamFilter(teamId){filterTeam=teamId;renderResultados();}
  function tryLogin(){if(document.getElementById('pw-input')?.value===ADMIN_PASS){isAdmin=true;renderAdmin();}else{document.getElementById('pw-err').textContent='Senha incorreta.';}}
  function logout(){isAdmin=false;renderAdmin();}
  function renderAll(){renderClassificacao();renderTimes();renderResultados();renderEstatisticas();renderAdmin();if(adminSection==='gols')updateGoalPlayers();if(adminSection==='jogos')updateMatchGoalTeams();}

  // 5. EXPORTA AS FUNÇÕES PARA O HTML (Necessário porque o script é do tipo "module")
  window.showTab = showTab;
  window.setFilter = setFilter;
  window.setTeamFilter = setTeamFilter;
  window.toggleMatchGoals = toggleMatchGoals;
  window.tryLogin = tryLogin;
  window.logout = logout;
  window.savePendingMatch = savePendingMatch;
  window.saveResult = saveResult;
  window.resetMatch = resetMatch;
  window.addPlayer = addPlayer;
  window.saveAdBanner = saveAdBanner;
  window.removeAdBanner = removeAdBanner;
  window.saveTeamImages = saveTeamImages;
  window.applyOfficialPlayers = applyOfficialPlayers;
  window.setAdminSection = setAdminSection;
  window.updateGoalPlayers = updateGoalPlayers;
  window.updateMatchGoalTeams = updateMatchGoalTeams;
  window.previewMatchGoalSubmit = previewMatchGoalSubmit;
  window.submitMatchGoalResult = submitMatchGoalResult;
  window.addGoals = addGoals;
  window.addBulkGoals = addBulkGoals;
  window.openTeam = openTeam;
  window.backToTeams = backToTeams;

</script>
