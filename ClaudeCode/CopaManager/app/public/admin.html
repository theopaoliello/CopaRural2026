<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Copa Manager</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#B8912F">
<link rel="stylesheet" href="/estilo.css">
<style>
  .card-camp { cursor: pointer; }
  .card-camp:hover { border-color: var(--verde-claro); }
  .evento-linha { display: grid; grid-template-columns: 1fr 1fr 1fr 64px 32px; gap: 6px; margin-bottom: 6px; }
  .evento-linha select, .evento-linha input { padding: 6px; font-size: 0.85rem; }
  fieldset { border: 1px solid var(--borda); border-radius: 10px; margin: 12px 0; }
  legend { font-weight: 700; color: var(--verde); padding: 0 6px; }
  .lista-jogadores li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  /* banner-heroi de entrada no Perfil do Atleta (aba "Sou Atleta") */
  .hero-atleta { display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, var(--verde) 0%, #12744f 55%, var(--verde-claro) 100%);
    color: #eafaf2; border-radius: 14px; padding: 15px 16px; margin-bottom: 6px;
    box-shadow: 0 6px 18px rgba(11,92,63,.25); }
  .hero-medal { font-size: 30px; line-height: 1; }
  .hero-txt { flex: 1; min-width: 0; }
  .hero-t { font-weight: 800; font-size: 1.05rem; color: #fff;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero-chip { background: rgba(255,255,255,.18); border-radius: 999px;
    font-size: .66rem; padding: 2px 8px; font-weight: 700; }
  .hero-d { font-size: .82rem; color: #cdeadd; margin-top: 3px; }
  .hero-cta { background: #fff; color: var(--verde); font-weight: 800; border: none;
    border-radius: 10px; padding: 9px 15px; font-size: .85rem; white-space: nowrap;
    cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .hero-cta:hover { background: #eafaf2; }
  @media (max-width: 520px) { .hero-atleta { flex-wrap: wrap; } .hero-cta { width: 100%; text-align: center; } }
</style>
</head>
<body>
<header class="topo">
  <span class="marca"><a href="/admin"><img src="/img/marca-branca.png" alt=""> Copa Manager</a></span>
  <div class="direita">
    <span id="ola" class="muted" style="color:#d9efe4"></span>
    <button class="botao secundario mini" id="btn-sair">Sair</button>
  </div>
</header>
<div id="barra-master" style="display:none;background:#b45309;color:#fff;padding:8px 16px;font-size:.9rem;
  align-items:center;gap:10px;flex-wrap:wrap"></div>

<div class="conteudo" id="app"><p class="muted">Carregando…</p></div>

<div class="modal-fundo" id="modal-fundo">
  <div class="modal">
    <button class="fechar" onclick="fecharModal()">×</button>
    <div id="modal-conteudo"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let DET = null;      // detalhe do campeonato aberto
let abaAtual = 'jogos';
let PAINEL = null;   // dados do painel inicial (cache p/ trocar de aba sem refetch)
// Aba ativa do painel inicial (RN: abas por papel). Lembrada entre acessos.
let ABA_PAINEL = (() => { try { return localStorage.getItem('cm_aba_painel') || 'organizo'; } catch { return 'organizo'; } })();

async function api(url, metodo = 'GET', corpo = null) {
  const resp = await fetch(url, {
    method: metodo,
    headers: corpo ? { 'Content-Type': 'application/json' } : {},
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (resp.status === 401) { location.href = '/'; throw new Error('Sessão expirada.'); }
  const dados = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(dados.mensagem || 'Erro inesperado.');
  return dados;
}

const avisar = (msg) => alert(msg);

// Le um <input type=file> e devolve data URL (para upload de imagem).
function lerArquivo(input) {
  return new Promise((resolve, reject) => {
    const arq = input.files?.[0];
    if (!arq) return reject(new Error('Escolha uma imagem.'));
    if (arq.size > 3 * 1024 * 1024) return reject(new Error('Imagem muito grande (limite 3 MB).'));
    const leitor = new FileReader();
    leitor.onload = () => resolve(leitor.result);
    leitor.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
    leitor.readAsDataURL(arq);
  });
}

function abrirModal(html) { $('#modal-conteudo').innerHTML = html; $('#modal-fundo').classList.add('aberto'); }
function fecharModal() { $('#modal-fundo').classList.remove('aberto'); }
$('#modal-fundo').onclick = (e) => { if (e.target === $('#modal-fundo')) fecharModal(); };

const nomeTime = (id) => DET?.times.find((t) => t.id === id)?.nome ?? 'A definir';
// Data compacta (23/07 14:50) — evita que o placar agendado estoure a linha no celular.
function formatarData(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) +
    (iso.includes('T') ? ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '');
}
function escudoHtml(t) {
  if (t?.escudo) return `<img class="escudo" src="${esc(t.escudo)}" alt="">`;
  return `<span class="escudo-placeholder">${t ? esc(t.nome[0].toUpperCase()) : '?'}</span>`;
}
// Data + hora completas (dd/mm/aaaa hh:mm), ex.: para o ultimo acesso no painel master.
function dataHoraCompleta(iso) {
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return null;
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
const nomeFase = (n) => ({ 1: 'Final', 2: 'Semifinal', 4: 'Quartas de final', 8: 'Oitavas de final' }[n] || `Fase de ${n * 2} times`);

// ================= LISTA DE CAMPEONATOS =================

function cardCampeonato(c) {
  return `<div class="card card-camp" onclick="telaCampeonato(${c.id})">
    <div class="linha-flex">
      <div>
        <strong>${esc(c.nome)}</strong> ${c.temporada ? `<span class="badge">${esc(c.temporada)}</span>` : ''}
        ${c.encerrado_em ? '<span class="badge" style="background:#fef3c7;color:#92400e" title="Campeonato encerrado com pódio">🏆 Encerrado</span>' : ''}
        ${c.status === 'arquivado' ? '<span class="badge" style="background:#eee;color:#666">Arquivado</span>' : ''}
        ${c.compartilhado ? `<span class="badge" title="Compartilhado com você">🤝 ${esc(c.dono_nome ?? 'dono')}</span>` : ''}
        ${c.n_seguidores ? `<span class="badge" title="Pessoas seguindo esta copa">👥 ${c.n_seguidores}</span>` : ''}
        <div class="muted">${c.n_times} times • ${c.n_encerrados}/${c.n_jogos} jogos com resultado</div>
      </div>
      <span class="espacador"></span>
      <a class="botao secundario mini" href="/c/${esc(c.slug)}" target="_blank" onclick="event.stopPropagation()">Página pública ↗</a>
    </div>
  </div>`;
}

// Card da secao "Seguindo" (RN-SG): abre a pagina PUBLICA (seguir nao da acesso
// administrativo, RN-SG-02) e permite deixar de seguir. Nao conta no limite.
function cardSeguindo(c) {
  return `<div class="card card-camp" onclick="location.href='/c/${esc(c.slug)}'">
    <div class="linha-flex">
      <div>
        <strong>${esc(c.nome)}</strong> ${c.temporada ? `<span class="badge">${esc(c.temporada)}</span>` : ''}
        ${c.status === 'arquivado' ? '<span class="badge" style="background:#eee;color:#666">Arquivado</span>' : ''}
        <div class="muted">Organizado por ${esc(c.dono_nome ?? '—')} • ${c.n_times} times • ${c.n_encerrados}/${c.n_jogos} jogos com resultado</div>
      </div>
      <span class="espacador"></span>
      <a class="botao secundario mini" href="/c/${esc(c.slug)}" target="_blank" onclick="event.stopPropagation()">Página pública ↗</a>
      <button class="botao secundario mini" onclick="event.stopPropagation();deixarDeSeguir('${esc(c.slug)}')">Deixar de seguir</button>
    </div>
  </div>`;
}

async function deixarDeSeguir(slug) {
  try { await api(`/api/seguir/${encodeURIComponent(slug)}`, 'DELETE'); telaLista(); }
  catch (e) { avisar(e.message); }
}

// ---------- conexoes de atleta (EF Perfil do Atleta, fase B) ----------

const BADGE_CONEXAO = {
  pendente: ['Pendente', 'background:#fef3c7;color:#92400e'],
  aprovada: ['Conectado', 'background:#d1fae5;color:#065f46'],
  recusada: ['Recusada', 'background:#fee2e2;color:#991b1b'],
};

function cardConexaoAtleta(cx) {
  const [rotulo, cor] = BADGE_CONEXAO[cx.status] ?? [cx.status, ''];
  const acao = cx.status === 'aprovada' ? 'Desconectar' : cx.status === 'pendente' ? 'Cancelar' : 'Remover';
  return `<div class="card card-camp" onclick="location.href='/c/${esc(cx.slug)}'">
    <div class="linha-flex">
      <div>
        <strong>${esc(cx.campeonato_nome)}</strong> ${cx.temporada ? `<span class="badge">${esc(cx.temporada)}</span>` : ''}
        <span class="badge" style="${cor}">${rotulo}</span>
        <div class="muted">${cx.alvo_tipo === 'time' ? 'Time/dupla' : 'Jogador'}: <strong>${esc(cx.alvo_nome ?? '—')}</strong></div>
      </div>
      <span class="espacador"></span>
      <button class="botao ${cx.status === 'aprovada' ? 'perigo' : 'secundario'} mini"
        onclick="event.stopPropagation();removerConexao(${cx.id}, '${cx.status}')">${acao}</button>
    </div>
  </div>`;
}

async function removerConexao(id, status) {
  const msg = status === 'aprovada'
    ? 'Desconectar desta copa? Suas estatísticas dela deixam de aparecer no seu perfil.'
    : 'Remover esta solicitação?';
  if (!confirm(msg)) return;
  try { await api(`/api/atleta/conexoes/${id}`, 'DELETE'); telaLista(); }
  catch (e) { avisar(e.message); }
}

// Fluxo "Me conectar a Copa" (EF 3.1): copa (das seguidas) -> time -> jogador
// (ou conexao direta ao time nas copas 2x2/1x1 sem elenco) -> observacao.
let CONEXAO = null; // { conectaveis, elenco }

async function modalConectarCopa() {
  const conectaveis = (await api('/api/atleta/conectaveis')).filter((c) => !c.minha_conexao || c.minha_conexao === 'recusada');
  CONEXAO = { conectaveis, elenco: null };
  if (!conectaveis.length) {
    abrirModal(`
      <h3>Me conectar à Copa</h3>
      <p class="muted">Para se conectar, primeiro <strong>siga</strong> a copa em que você joga:
      abra a página pública dela e toque em "Seguir esta Copa". Ela aparecerá aqui.</p>`);
    return;
  }
  abrirModal(`
    <h3>Me conectar à Copa</h3>
    <p class="muted">Escolha a copa em que você joga. O organizador vai avaliar sua solicitação.</p>
    <label>Copa</label>
    <select id="conectar-copa" onchange="conectarEscolheuCopa()">
      <option value="">Escolha…</option>
      ${conectaveis.map((c) => `<option value="${esc(c.slug)}">${esc(c.nome)}${c.temporada ? ` (${esc(c.temporada)})` : ''}</option>`).join('')}
    </select>
    <div id="conectar-passos"></div>`);
}

async function conectarEscolheuCopa() {
  const slug = $('#conectar-copa').value;
  const alvoDiv = $('#conectar-passos');
  if (!slug) { alvoDiv.innerHTML = ''; return; }
  try { CONEXAO.elenco = await api(`/api/atleta/copa/${encodeURIComponent(slug)}/elenco`); }
  catch (e) { alvoDiv.innerHTML = `<p class="aviso erro" style="display:block">${esc(e.message)}</p>`; return; }
  const E = CONEXAO.elenco;
  if (E.pelada) {
    alvoDiv.innerHTML = `
      <label>Quem é você no elenco?</label>
      <select id="conectar-jogador">${opcoesJogador(E.jogadores)}</select>
      ${camposFinaisConexao()}`;
    return;
  }
  alvoDiv.innerHTML = `
    <label>Seu time</label>
    <select id="conectar-time" onchange="conectarEscolheuTime()">
      <option value="">Escolha…</option>
      ${E.times.map((t) => `<option value="${t.id}">${esc(t.nome)}</option>`).join('')}
    </select>
    <div id="conectar-jogador-passo"></div>`;
}

function conectarEscolheuTime() {
  const time = CONEXAO.elenco.times.find((t) => t.id === Number($('#conectar-time').value));
  const passo = $('#conectar-jogador-passo');
  if (!time) { passo.innerHTML = ''; return; }
  if (time.sem_elenco) {
    // Copas 2x2/1x1: o nome do time E o nome das pessoas — conexao ao time.
    passo.innerHTML = `
      <p class="muted">Este time não tem jogadores cadastrados: você se conectará ao
      <strong>time/dupla ${esc(time.nome)}</strong> e receberá os resultados dele.</p>
      ${camposFinaisConexao()}`;
    return;
  }
  passo.innerHTML = `
    <label>Quem é você no elenco?</label>
    <select id="conectar-jogador">${opcoesJogador(time.jogadores)}</select>
    ${camposFinaisConexao()}`;
}

function opcoesJogador(jogadores) {
  return ['<option value="">Escolha…</option>', ...jogadores.map((j) =>
    `<option value="${j.id}" ${j.disponivel ? '' : 'disabled'}>${esc(j.nome)}${j.numero ? ` (${j.numero})` : ''}${j.disponivel ? '' : ' — já reivindicado'}</option>`,
  )].join('');
}

function camposFinaisConexao() {
  return `
    <label>Observação para o organizador (opcional)</label>
    <input type="text" id="conectar-obs" maxlength="200" placeholder='Ex.: "sou o Theo, camisa 10"'>
    <p><button class="botao" onclick="enviarConexao()">Solicitar conexão</button></p>`;
}

async function enviarConexao() {
  const time = CONEXAO.elenco.pelada ? null : CONEXAO.elenco.times.find((t) => t.id === Number($('#conectar-time')?.value));
  const jogadorId = $('#conectar-jogador')?.value ? Number($('#conectar-jogador').value) : null;
  if (!jogadorId && !time?.sem_elenco) { avisar('Escolha o seu nome no elenco.'); return; }
  try {
    await api('/api/atleta/conexoes', 'POST', {
      slug: CONEXAO.elenco.campeonato.slug,
      jogador_id: jogadorId,
      time_id: !jogadorId && time?.sem_elenco ? time.id : null,
      observacao: $('#conectar-obs')?.value || null,
    });
    fecharModal();
    avisar('Solicitação enviada. O organizador da copa vai avaliar.');
    telaLista();
  } catch (e) { avisar(e.message); }
}

// ---------- Painel do Atleta (EF Perfil do Atleta, fase C) ----------
// Guias "Geral" + uma por esporte com dado; blocos Conquistas / Desempenho /
// Producao; contadores clicaveis (drill-down) e filtro de ano (RN-AT-14/15/16).
// Toda a agregacao acontece aqui em cima do payload do /api/atleta/perfil
// (uma linha por copa, totais + quebra por ano).

let PERFIL = null; // { copas, guia, ano }

const STATS_ZERO = { jogos: 0, v: 0, e: 0, d: 0, gols: 0, pontos: 0, sets_vencidos: 0, sets_perdidos: 0 };
const recorte = (copa) => (PERFIL.ano === 'todos' ? copa.totais : (copa.anos[PERFIL.ano] ?? STATS_ZERO));
const tituloNoRecorte = (copa) => copa.colocacao != null
  && (PERFIL.ano === 'todos' || copa.ano_titulo === Number(PERFIL.ano));
const copaNoRecorte = (copa) => PERFIL.ano === 'todos' || !!copa.anos[PERFIL.ano]
  || copa.ano_titulo === Number(PERFIL.ano);
const copasDaGuia = () => PERFIL.copas.filter((c) => PERFIL.guia === 'geral' || c.esporte === PERFIL.guia);

async function telaPerfilAtleta() {
  const copas = await api('/api/atleta/perfil');
  PERFIL = { copas, guia: 'geral', ano: 'todos' };
  renderPerfilAtleta();
}

function mudarGuiaPerfil(guia) { PERFIL.guia = guia; renderPerfilAtleta(); }
function mudarAnoPerfil(ano) { PERFIL.ano = ano; renderPerfilAtleta(); }

// Tile de contador; com `detalhe`, e clicavel e abre a lista (RN-AT-16).
function tilePerfil(rotulo, valor, detalhe) {
  return `<div class="card" style="flex:1;min-width:96px;text-align:center;margin:0;padding:12px 8px${detalhe ? ';cursor:pointer' : ''}"
    ${detalhe ? `onclick="modalDetalhePerfil('${detalhe}')"` : ''}>
    <div style="font-size:1.5rem;font-weight:700">${valor}${detalhe ? ' <span class="muted" style="font-size:.85rem">›</span>' : ''}</div>
    <div class="muted" style="font-size:.78rem">${rotulo}</div>
  </div>`;
}

function renderPerfilAtleta() {
  if (!PERFIL.copas.length) {
    $('#app').innerHTML = `
      <div class="linha-flex" style="margin-bottom:10px"><a href="#" onclick="telaLista();return false">← Meus campeonatos</a></div>
      <div class="card"><p class="muted" style="margin:0">Você ainda não tem conexões aprovadas.
      Siga a copa em que você joga e use "Me conectar à Copa" na tela inicial.</p></div>`;
    return;
  }
  // Guias: Geral + esportes presentes; anos: uniao das quebras + anos de titulo.
  const esportes = [...new Map(PERFIL.copas.map((c) => [c.esporte, c.esporte_nome]))];
  const anos = [...new Set(PERFIL.copas.flatMap((c) => [
    ...Object.keys(c.anos).map(Number), ...(c.ano_titulo ? [c.ano_titulo] : []),
  ]))].sort((a, b) => b - a);

  const escopo = copasDaGuia();
  const soma = (campo) => escopo.reduce((t, c) => t + recorte(c)[campo], 0);
  const conquistas = (n) => escopo.filter((c) => c.colocacao === n && tituloNoRecorte(c)).length;
  const nCopas = escopo.filter(copaNoRecorte).length;
  const temEmpate = escopo.some((c) => c.empate_possivel);
  const temGols = escopo.some((c) => c.producao === 'gols');
  const temPontos = escopo.some((c) => c.producao === 'pontos');
  const temSets = escopo.some((c) => c.producao === 'sets');
  // Media de pontos por jogo (basquete): so sobre as copas de pontos do recorte.
  const copasPontos = escopo.filter((c) => c.producao === 'pontos');
  const jogosPontos = copasPontos.reduce((t, c) => t + recorte(c).jogos, 0);
  const media = jogosPontos ? (copasPontos.reduce((t, c) => t + recorte(c).pontos, 0) / jogosPontos).toFixed(1) : null;

  $('#app').innerHTML = `
    <div class="linha-flex" style="margin-bottom:10px">
      <a href="#" onclick="telaLista();return false">← Meus campeonatos</a>
    </div>
    <h2 style="margin:4px 0 10px">📊 Painel do Atleta</h2>
    <div class="abas">
      <button class="aba ${PERFIL.guia === 'geral' ? 'ativa' : ''}" onclick="mudarGuiaPerfil('geral')">Geral</button>
      ${esportes.map(([chave, nome]) =>
        `<button class="aba ${PERFIL.guia === chave ? 'ativa' : ''}" onclick="mudarGuiaPerfil('${chave}')">${esc(nome)}</button>`).join('')}
    </div>
    <div class="linha-flex" style="margin:10px 0">
      <label style="margin:0">Ano</label>
      <select style="width:auto" onchange="mudarAnoPerfil(this.value)">
        <option value="todos">Todos</option>
        ${anos.map((a) => `<option value="${a}" ${String(PERFIL.ano) === String(a) ? 'selected' : ''}>${a}</option>`).join('')}
      </select>
    </div>
    <h3 style="margin:14px 0 6px">🏆 Conquistas</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${tilePerfil('Títulos', conquistas(1), 'titulos')}
      ${tilePerfil('2º lugar', conquistas(2), 'segundo')}
      ${tilePerfil('3º lugar', conquistas(3), 'terceiro')}
    </div>
    <h3 style="margin:14px 0 6px">📈 Desempenho</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${tilePerfil('Copas', nCopas, 'copas')}
      ${tilePerfil('Vitórias', soma('v'))}
      ${temEmpate ? tilePerfil('Empates', soma('e')) : ''}
      ${tilePerfil('Derrotas', soma('d'))}
    </div>
    ${temGols || temPontos || temSets ? `
    <h3 style="margin:14px 0 6px">⚽ Produção</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${temGols ? tilePerfil('Gols', soma('gols'), 'gols') : ''}
      ${temPontos ? tilePerfil(`Pontos${media != null ? ` (média ${media}/jogo)` : ''}`, soma('pontos'), 'pontos') : ''}
      ${temSets ? tilePerfil('Sets vencidos', soma('sets_vencidos'), 'sets') : ''}
      ${temSets ? tilePerfil('Sets perdidos', soma('sets_perdidos'), 'sets') : ''}
    </div>` : ''}
    <p class="muted" style="margin-top:14px;font-size:.78rem">Estatísticas das copas conectadas, calculadas ao vivo.
    Fora da Pelada Épica, jogos e sets são <strong>do time/dupla</strong> em que você joga. Toque num contador para ver de quais copas ele veio.</p>`;
}

const MEDALHA_PERFIL = { 1: '🥇', 2: '🥈', 3: '🥉' };
const ICONE_ESPORTE_PERFIL = (copa) => `<span class="muted">${esc(copa.esporte_nome)}</span>`;

// Drill-down (RN-AT-16): lista das copas por tras de um contador. Copa ainda
// publicada tem link para a pagina publica; despublicada fica sem link.
function modalDetalhePerfil(tipo) {
  const rotulos = {
    titulos: 'Títulos', segundo: '2º lugar', terceiro: '3º lugar',
    copas: 'Copas disputadas', gols: 'Gols', pontos: 'Pontos', sets: 'Sets',
  };
  const escopo = copasDaGuia();
  let linhas = [];
  const linha = (copa, valorHtml) => `
    <div style="border-bottom:1px solid var(--borda);padding:9px 0" class="linha-flex">
      <div>
        ${copa.publicado ? `<a href="/c/${esc(copa.slug)}" target="_blank"><strong>${esc(copa.nome)}</strong></a>` : `<strong>${esc(copa.nome)}</strong>`}
        ${copa.temporada ? `<span class="badge">${esc(copa.temporada)}</span>` : ''}
        ${copa.removido ? '<span class="badge" style="background:#eee;color:#666" title="A competição foi excluída; suas estatísticas ficaram preservadas">Campeonato removido</span>' : ''}
        <div class="muted" style="font-size:.78rem">${PERFIL.guia === 'geral' ? `${esc(copa.esporte_nome)} • ` : ''}${esc(copa.time_nome ?? copa.alvo_nome ?? '')}</div>
      </div>
      <span class="espacador"></span>
      <div style="font-weight:700">${valorHtml}</div>
    </div>`;

  if (tipo === 'titulos' || tipo === 'segundo' || tipo === 'terceiro') {
    const n = { titulos: 1, segundo: 2, terceiro: 3 }[tipo];
    linhas = escopo.filter((c) => c.colocacao === n && tituloNoRecorte(c))
      .map((c) => linha(c, `${MEDALHA_PERFIL[n]}${c.ano_titulo ? ` <span class="muted" style="font-weight:400">${c.ano_titulo}</span>` : ''}`));
  } else if (tipo === 'copas') {
    linhas = escopo.filter(copaNoRecorte)
      .map((c) => linha(c, `<span class="muted" style="font-weight:400">${recorte(c).jogos} jogo${recorte(c).jogos === 1 ? '' : 's'}</span>`));
  } else if (tipo === 'gols' || tipo === 'pontos') {
    linhas = escopo.filter((c) => c.producao === tipo && recorte(c)[tipo] > 0)
      .map((c) => linha(c, String(recorte(c)[tipo])));
  } else if (tipo === 'sets') {
    linhas = escopo.filter((c) => c.producao === 'sets' && recorte(c).jogos > 0)
      .map((c) => linha(c, `${recorte(c).sets_vencidos} <span class="muted" style="font-weight:400">x</span> ${recorte(c).sets_perdidos}`));
  }
  abrirModal(`
    <h3>${rotulos[tipo]}${PERFIL.ano !== 'todos' ? ` — ${PERFIL.ano}` : ''}</h3>
    ${linhas.join('') || '<p class="muted">Nada por aqui neste recorte.</p>'}`);
}

async function telaLista() {
  DET = null;
  const [lista, limites, seguindo, conexoes, perfil] = await Promise.all([
    api('/api/campeonatos'), api('/api/conta/limites'), api('/api/seguindo'),
    api('/api/atleta/conexoes'), api('/api/atleta/perfil'),
  ]);
  PAINEL = { lista, limites, seguindo, conexoes, perfil };
  renderPainel();
}

// Painel inicial em tres abas por papel do usuario (RN: abas por papel):
// Organizo (copas que cria e coadministra), Acompanho (seguindo) e Sou Atleta
// (perfil + conexoes). A aba ativa e lembrada entre acessos (localStorage).
function mudarAbaPainel(aba) {
  ABA_PAINEL = aba;
  try { localStorage.setItem('cm_aba_painel', aba); } catch { /* modo privado */ }
  renderPainel();
}

function renderPainel() {
  const { lista, seguindo, conexoes } = PAINEL;
  const temPendente = conexoes.some((cx) => cx.status === 'pendente');
  // rotulo, contador e sino (novidade) de cada aba
  const abas = [
    ['organizo', '🏆 Organizo', lista.length, false],
    ['acompanho', '👀 Acompanho', seguindo.length, false],
    ['atleta', '🎽 Sou Atleta', conexoes.length, temPendente],
  ];
  if (!abas.some(([k]) => k === ABA_PAINEL)) ABA_PAINEL = 'organizo';
  const ajuda = {
    organizo: 'Campeonatos que você cria e coadministra.',
    acompanho: 'Copas que você segue. Você vê tudo, mas não administra.',
    atleta: 'Onde você joga: conquistas, desempenho e produção.',
  }[ABA_PAINEL];
  $('#app').innerHTML = `
    <div class="abas">
      ${abas.map(([k, r, n, sino]) => `<button class="aba ${ABA_PAINEL === k ? 'ativa' : ''}" onclick="mudarAbaPainel('${k}')">
        ${r}${n ? ` <span class="badge">${n}</span>` : ''}${sino ? ' 🔔' : ''}</button>`).join('')}
    </div>
    <p class="muted" style="margin:-6px 0 16px;font-size:.9rem">${ajuda}</p>
    ${painelAba()}
    <p class="muted" style="text-align:center;margin-top:24px">
      <a href="/privacidade.html" target="_blank">Política de Privacidade</a> •
      <a href="#" onclick="modalExcluirConta();return false">Excluir minha conta</a>
    </p>
  `;
}

function painelAba() {
  const { lista, limites, seguindo, conexoes, perfil } = PAINEL;
  if (ABA_PAINEL === 'acompanho') return abaAcompanho(seguindo);
  if (ABA_PAINEL === 'atleta') return abaSouAtleta(conexoes, perfil);
  return abaOrganizo(lista, limites);
}

function abaOrganizo(lista, limites) {
  const proprios = lista.filter((c) => !c.compartilhado);
  const compartilhados = lista.filter((c) => c.compartilhado);
  const cheio = limites.usados >= limites.max_campeonatos;
  return `
    <div class="linha-flex" style="margin-bottom:14px">
      <h2 style="margin:0">Meus campeonatos</h2>
      <span class="badge" title="Campeonatos usados / limite do seu plano">${limites.usados}/${limites.max_campeonatos}</span>
      <span class="espacador"></span>
      <button class="botao" onclick="${cheio ? 'avisoLimiteCampeonatos()' : 'telaNovo()'}">+ Novo campeonato</button>
    </div>
    ${cheio ? `<div class="aviso erro" style="display:block;margin-bottom:12px">Sua conta atingiu o limite de ${limites.max_campeonatos} campeonatos simultâneos. Exclua um campeonato que já terminou ou fale com o suporte para ampliar seu plano.</div>` : ''}
    ${proprios.length ? proprios.map(cardCampeonato).join('')
    : '<div class="card"><p>Você ainda não tem campeonatos. Crie o primeiro! 🏆</p></div>'}
    ${compartilhados.length ? `
      <h3 style="margin:22px 0 8px">Compartilhados comigo</h3>
      <p class="muted" style="margin:0 0 8px">Campeonatos que outras pessoas compartilharam com você. Não contam no seu limite.</p>
      ${compartilhados.map(cardCampeonato).join('')}` : ''}`;
}

function abaAcompanho(seguindo) {
  return seguindo.length
    ? `${seguindo.map(cardSeguindo).join('')}
      <div class="card" style="border-style:dashed"><p class="muted" style="margin:0">
      Para acompanhar outra copa, abra a página pública dela e toque em <strong>“Seguir esta Copa”</strong>.
      Seguir não dá acesso de administração.</p></div>`
    : `<div class="card"><p class="muted" style="margin:0">Você ainda não segue nenhuma copa.
      Abra a página pública de uma copa em que você torce ou joga e toque em <strong>“Seguir esta Copa”</strong>
      — ela aparece aqui.</p></div>`;
}

function abaSouAtleta(conexoes, perfil) {
  const temPerfil = perfil.length > 0;
  const n = perfil.length;
  const hero = `
    <div class="hero-atleta">
      <span class="hero-medal">🏅</span>
      <div class="hero-txt">
        <div class="hero-t">Perfil de Atleta${temPerfil ? ` <span class="hero-chip">${n} copa${n === 1 ? '' : 's'} conectada${n === 1 ? '' : 's'}</span>` : ''}</div>
        <div class="hero-d">${temPerfil
          ? 'Suas conquistas, gols, pontos e desempenho reunidos em um só lugar.'
          : 'Conecte-se à copa em que você joga para começar a acompanhar suas estatísticas.'}</div>
      </div>
      <button class="hero-cta" onclick="${temPerfil ? 'telaPerfilAtleta()' : 'modalConectarCopa()'}">
        ${temPerfil ? 'Ver meu perfil →' : 'Me conectar à Copa →'}</button>
    </div>`;
  return `
    ${hero}
    <div class="linha-flex" style="margin:18px 0 8px">
      <h3 style="margin:0">Minhas conexões</h3>
      <span class="espacador"></span>
      <button class="botao secundario mini" onclick="modalConectarCopa()">Me conectar à Copa</button>
    </div>
    ${conexoes.length ? conexoes.map(cardConexaoAtleta).join('')
    : '<div class="card"><p class="muted" style="margin:0">Conecte-se a uma copa que você joga para, em breve, acompanhar suas estatísticas por aqui. Siga a copa e clique em "Me conectar à Copa".</p></div>'}`;
}

function avisoLimiteCampeonatos() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// LGPD: exclusao da propria conta e de todos os dados (art. 18).
function modalExcluirConta() {
  abrirModal(`
    <h3>Excluir minha conta</h3>
    <p>Isso apaga <strong>definitivamente</strong> sua conta e todos os seus campeonatos,
    times, jogadores, resultados e imagens. Não tem volta.</p>
    <label>Confirme com sua senha (contas Google: digite o e-mail da conta)</label>
    <input type="password" id="excluir-confirmacao" autocomplete="current-password">
    <div id="aviso-excluir" class="aviso"></div>
    <p><button class="botao perigo" style="width:100%" onclick="excluirMinhaConta()">Excluir tudo definitivamente</button></p>
  `);
}
async function excluirMinhaConta() {
  if (!confirm('Tem certeza MESMO? Todos os seus dados serão apagados.')) return;
  try {
    await api('/api/auth/minha-conta', 'DELETE', { confirmacao: $('#excluir-confirmacao').value });
    location.href = '/';
  } catch (e) {
    const av = $('#aviso-excluir'); av.textContent = e.message; av.className = 'aviso erro';
  }
}

// Catalogo de esportes (carregado uma vez por sessao do painel).
let ESPORTES = null;
let ESP = null; // preset do esporte do campeonato aberto (setado em telaCampeonato)
async function catalogoEsportes() {
  if (!ESPORTES) ESPORTES = await api('/api/esportes');

// Passo 0 do wizard: escolha do esporte (imutavel depois da criacao).

  const esportes = await catalogoEsportes();
  $('#app').innerHTML = `
    <h2>Novo campeonato</h2>
    <div class="card">
      <h3>Qual é o esporte do seu campeonato?</h3>
      <div class="grade-esportes">
        ${esportes.map((e) => `
          <button class="botao-esporte" title="${esc(e.nome)}" aria-label="${esc(e.nome)}"
            ${e.disponivel ? `onclick="telaNovoForm('${e.chave}')"` : 'disabled'}>

function telaNovoForm(chaveEsporte) {
  const esporte = ESPORTES.find((e) => e.chave === chaveEsporte);
  if (esporte.ranking === 'individual') return telaNovoFormPelada(esporte);
  $('#app').innerHTML = `
    <h2>Novo campeonato</h2>
    <div class="linha-flex" style="margin-bottom:10px">
      <img src="${esc(esporte.icone)}" alt="" style="width:34px;height:34px;object-fit:contain">
      <strong>${esc(esporte.nome)}</strong>
      <a href="#" onclick="telaNovo();return false" class="muted">trocar esporte</a>
    </div>
    <form id="form-novo" class="card">
      <fieldset><legend>1. Identidade</legend>
        <div class="grid-2">
          <div><label>Nome *</label><input type="text" name="nome" required placeholder="Copa da Várzea"></div>
          <div><label>Temporada</label><input type="text" name="temporada" placeholder="2026"></div>
          ${esporte.variantes.length ? `<div><label>Variante</label>
            <select name="modalidade">${esporte.variantes.map((v) => `<option>${esc(v)}</option>`).join('')}</select>
          </div>` : ''}
          <div><label>Cor do campeonato</label><input type="color" name="cor_tema" value="#0b5c3f" style="height:42px;width:100%"></div>
        </div>
        <label>Descrição</label><textarea name="descricao" placeholder="Fala do campeonato para a página pública…"></textarea>
      </fieldset>

      <fieldset><legend>2. Formato</legend>
        <label>Tipo de competição</label>
        <select name="formato" id="sel-formato">
          <option value="pontos">Pontos corridos</option>
          <option value="mata">Mata-mata</option>
          <option value="grupos_mata">Fase de grupos + Mata-mata</option>
        </select>
        ${esporte.placar === 'sets' ? `
        <label>Formato da partida</label>
        <select name="melhor_de">
          ${esporte.melhor_de.opcoes.map((n) => `<option value="${n}" ${n === esporte.melhor_de.padrao ? 'selected' : ''}>${n === 0 ? 'Placar livre (qualquer nº de sets)' : n === 1 ? 'Set único' : `Melhor de ${n} sets`}</option>`).join('')}
        </select>` : ''}
        <div class="grid-2">
          <div id="campo-grupos" style="display:none">
            <label>Quantidade de grupos</label><input type="number" name="num_grupos" value="2" min="1">
            <label>Classificados por grupo</label><input type="number" name="classificados_por_grupo" value="2" min="1">
            <p id="resumo-vagas" class="muted" style="display:none"></p>
          </div>
          <div>
            <div id="campo-iv-grupos"><label><input type="checkbox" name="ida_volta_grupos" style="width:auto"> Turno e returno (ida e volta)</label></div>
            ${esporte.chave === 'futebol' ? `<div id="campo-iv-mata" style="display:none"><label><input type="checkbox" name="ida_volta_mata" style="width:auto"> Mata-mata com jogos de ida e volta</label></div>` : ''}
          </div>
        </div>
      </fieldset>

      <fieldset><legend>3. ${esc(esporte.rotulos.participantes)}</legend>
        <label>${esc(esporte.rotulos.participante)} por linha * <span class="muted">(até 30 caracteres cada)</span></label>
        <textarea name="times" rows="8" required placeholder="Real Baixada&#10;Unidos da Vila&#10;Juventude FC&#10;..."></textarea>
        <label><input type="checkbox" name="sortear" checked style="width:auto"> Sortear a distribuição (grupos/chaveamento)</label>
        <p class="muted">Desmarcado, a ordem digitada manda: os primeiros times formam o Grupo A (e assim por diante);
        no mata-mata, cada dupla de linhas vira um confronto (1º×2º, 3º×4º…).</p>
        <p class="muted">A tabela de jogos é gerada automaticamente ao criar. Elencos, escudos e fotos você cadastra depois.</p>
      </fieldset>

      <div id="aviso-novo" class="aviso"></div>
      <div class="linha-flex">
        <button type="button" class="botao secundario" onclick="telaLista()">Cancelar</button>
        <span class="espacador"></span>
        <button class="botao" type="submit">Criar campeonato 🏆</button>
      </div>
    </form>
  `;
  const mudouFormato = () => {
    const f = $('#sel-formato').value;
    $('#campo-grupos').style.display = f === 'grupos_mata' ? '' : 'none';
    $('#campo-iv-grupos').style.display = f !== 'mata' ? '' : 'none';
    // Ida e volta no mata so existe no futebol (RN-TC-05): o campo pode nem estar na tela.
    const ivMata = $('#campo-iv-mata');
    if (ivMata) ivMata.style.display = f !== 'pontos' ? '' : 'none';
    atualizarResumoVagas();
  };
  $('#sel-formato').onchange = mudouFormato;

  // Resumo ao vivo do efeito de grupos x classificados (Melhores Colocados):
  // a mesma regra do servidor, via /api/vagas-preview, com debounce.
  let timerResumo = null;
  const atualizarResumoVagas = () => {
    const el = $('#resumo-vagas');
    if ($('#sel-formato').value !== 'grupos_mata') { el.style.display = 'none'; return; }
    clearTimeout(timerResumo);
    timerResumo = setTimeout(async () => {
      const form = $('#form-novo');
      const grupos = Number(form.num_grupos.value || 1);
      const classificados = Number(form.classificados_por_grupo.value || 2);
      const times = String(form.times.value).split('\n').map((s) => s.trim()).filter(Boolean).length;
      try {
        const p = await api(`/api/vagas-preview?grupos=${grupos}&classificados=${classificados}&times=${times}`);
        const partes = [p.aviso ?? p.resumo];
        if (p.modo === 'inviavel' && p.sugestao) partes.push(`Sugestão: ${p.sugestao}.`);
        if (p.grupos_desiguais && (p.modo === 'repescagem' || p.modo === 'corte')) {
          partes.push('Grupos de tamanhos diferentes: o ranking dos melhores colocados usa médias por jogo.');
        }
        el.textContent = partes.join(' ');
        el.style.display = '';
      } catch { el.style.display = 'none'; }
    }, 250);
  };
  ['num_grupos', 'classificados_por_grupo', 'times'].forEach((campo) => {
    $('#form-novo')[campo].addEventListener('input', atualizarResumoVagas);
  });
  mudouFormato();

  $('#form-novo').onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const c = await api('/api/campeonatos', 'POST', {
        esporte: chaveEsporte,
        nome: f.get('nome'), temporada: f.get('temporada'), modalidade: f.get('modalidade'),
        descricao: f.get('descricao'), cor_tema: f.get('cor_tema'), formato: f.get('formato'),
        melhor_de: f.get('melhor_de') ? Number(f.get('melhor_de')) : undefined,
        num_grupos: Number(f.get('num_grupos') || 1),
        classificados_por_grupo: Number(f.get('classificados_por_grupo') || 2),
        ida_volta_grupos: !!f.get('ida_volta_grupos'), ida_volta_mata: !!f.get('ida_volta_mata'),
        sortear: !!f.get('sortear'),
        times: String(f.get('times')).split('\n').map((s) => s.trim()).filter(Boolean),
      });
      telaCampeonato(c.id);
    } catch (err) {
      const av = $('#aviso-novo'); av.textContent = err.message; av.className = 'aviso erro';
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  };
}

async function telaCampeonato(id, aba = abaAtual) {
  DET = await api(`/api/campeonatos/${id}`);
  // Preset do esporte do campeonato aberto: dirige rotulos, colunas e modal de resultado.
  ESP = (await catalogoEsportes()).find((e) => e.chave === DET.campeonato.esporte) ?? null;
  const c = DET.campeonato;
  // meu_acesso (RN-CO-04/05): dono ve tudo; colaborador so as secoes das flags,
  // mais a Classificacao (leitura). Config e Banners sao sempre dono-only.
  const A = DET.meu_acesso ?? { dono: true, jogos: true, times: true, regras: true, sorteio: true, banners: true, config: true };
  const abas = [
    ...(A.jogos ? [['jogos', 'Jogos']] : []),
    ...(A.times ? [['times', ESP?.rotulos.participantes ?? 'Times']] : []),
    ...(ESP?.ranking === 'individual' && A.sorteio ? [['sorteio', 'Sorteio']] : []),
    ['classificacao', ESP?.rotulos.classificacao ?? 'Classificação'],
    ...(A.regras ? [['regras', 'Regras']] : []),
    ...(A.banners && DET.banners_liberados ? [['banners', 'Banners']] : []),
    // Conexoes de atleta (fase B): decidir quem e quem e dono-only (RN-AT-05);
    // o badge numerico e como o dono descobre pedidos novos (sem notificacao).
    ...(A.dono ? [['atletas', `Atletas${DET.n_conexoes_pendentes ? ` 🔔${DET.n_conexoes_pendentes}` : ''}`]] : []),
    ...(A.config ? [['config', 'Configurações']] : []),
  ];
  // Se a aba pedida nao esta disponivel (colaborador, recurso revogado), cai na
  // primeira disponivel (a Classificacao sempre existe).
  if (!abas.some(([k]) => k === aba)) aba = abas[0][0];
  abaAtual = aba;
  $('#app').innerHTML = `
    <div class="linha-flex" style="margin-bottom:10px">
      <a href="#" onclick="telaLista();return false">← Meus campeonatos</a>
      <span class="espacador"></span>
      <a class="botao secundario mini" href="/c/${esc(c.slug)}" target="_blank">Página pública ↗</a>
    </div>
    <h2 style="margin:4px 0">${esc(c.nome)} ${c.temporada ? `<span class="badge">${esc(c.temporada)}</span>` : ''}
      ${c.encerrado_em ? '<span class="badge" style="background:#fef3c7;color:#92400e" title="Campeonato encerrado com pódio">🏆 Encerrado</span>' : ''}
      ${A.dono ? '' : '<span class="badge" title="Você é colaborador deste campeonato">🤝 Colaborador</span>'}</h2>
    <div class="abas">
      ${abas.map(([k, r]) => `<button class="aba ${aba === k ? 'ativa' : ''}" onclick="telaCampeonato(${id}, '${k}')">${r}</button>`).join('')}
    </div>
    <div id="painel"></div>
  `;
  const abaParticipantes = ESP?.ranking === 'individual' ? abaJogadoresPelada : abaTimes;
  ({ jogos: abaJogos, times: abaParticipantes, sorteio: abaSorteio, classificacao: abaClassif, regras: abaRegras, banners: abaBanners, atletas: abaAtletas, config: abaConfig }[aba])();
}

function parciaisTexto(jogoId) {
  const parciais = (DET.sets ?? []).filter((s) => s.jogo_id === jogoId);
  return parciais.length ? parciais.map((p) => `${p.pontos_casa}-${p.pontos_fora}`).join(' / ') : '';
}

function linhaJogoAdmin(j) {
  const casa = DET.times.find((t) => t.id === j.time_casa_id);
  const fora = DET.times.find((t) => t.id === j.time_fora_id);
  const parciais = j.status === 'encerrado' ? parciaisTexto(j.id) : '';
  const placar = j.status === 'encerrado'
    ? `${j.gols_casa} x ${j.gols_fora}${parciais ? `<div class="muted" style="font-size:.68rem">(${parciais})</div>` : ''}`
    : (j.data ? esc(formatarData(j.data)) : 'A definir');
  const prontos = j.time_casa_id && j.time_fora_id;
  return `<div class="jogo" style="cursor:default">
    <span class="mandante">${esc(casa?.nome ?? 'A definir')} ${escudoHtml(casa)}</span>
    <span class="placar ${j.status}">${placar}${j.penaltis_casa != null ? `<div class="muted" style="font-size:.68rem">(${j.penaltis_casa}x${j.penaltis_fora} pen)</div>` : ''}</span>
    <span class="visitante">${escudoHtml(fora)} ${esc(fora?.nome ?? 'A definir')}</span>
    <span class="acoes-jogo" style="display:flex;gap:4px;flex-wrap:wrap">
      ${prontos ? `<button class="botao mini" onclick="modalResultado(${j.id})">${j.status === 'encerrado' ? 'Corrigir' : 'Lançar resultado'}</button>` : ''}
      <button class="botao secundario mini" onclick="modalAgenda(${j.id})">Agenda</button>
      ${j.status === 'encerrado' ? `<button class="botao secundario mini" onclick="modalSumula(${j.id})">Súmula${j.sumula ? ' ✓' : ''}</button>
      <button class="botao perigo mini" onclick="apagarResultado(${j.id})">Apagar</button>` : ''}
      ${ESP?.ranking === 'individual' && j.status !== 'encerrado' ? `<button class="botao perigo mini" onclick="excluirJogo(${j.id})">Excluir</button>` : ''}
    </span>
  </div>`;
}

function abaJogos() {
  const c = DET.campeonato;
  const grupos = DET.jogos.filter((j) => j.fase === 'grupos');
  const mata = DET.jogos.filter((j) => j.fase === 'mata');
  let html = '';

  // Pelada Epica: progresso da temporada + criacao de jogos um a um.
  if (ESP?.ranking === 'individual') {
    const encerrados = DET.jogos.filter((j) => j.status === 'encerrado').length;
    const completa = encerrados >= c.jogos_temporada;
    html += `<div class="card linha-flex">
      <span>Temporada: <strong>${encerrados}/${c.jogos_temporada}</strong> jogos com resultado
        ${completa ? '<span class="badge">Temporada completa 🏁</span>' : ''}</span>
      <span class="espacador"></span>
      <button class="botao" onclick="modalNovoJogo()">+ Novo jogo</button>
    </div>`;
  }

  if (c.formato === 'grupos_mata' && !mata.length) {
    const pendentes = grupos.filter((j) => j.status !== 'encerrado').length;
    html += `<div class="card">
      <div class="linha-flex">
        <span>Fase de grupos: <strong>${grupos.length - pendentes}/${grupos.length}</strong> jogos com resultado.</span>
        <span class="espacador"></span>
        <button class="botao" ${pendentes ? 'disabled' : ''} onclick="gerarMata()">Gerar mata-mata 🏆</button>
      </div>
      ${DET.vagas?.resumo ? `<p class="muted" style="margin:6px 0 0">${esc(DET.vagas.resumo)}</p>` : ''}
    </div>`;
  }

  if (grupos.length) {
    const rodadas = [...new Set(grupos.map((j) => j.rodada))].sort((a, b) => a - b);
    const nomeGrupo = (gid) => DET.grupos.find((g) => g.id === gid)?.nome;
    html += `<div class="card">${rodadas.map((r) => `
      <div class="rotulo-rodada">Rodada ${r}</div>
      ${grupos.filter((j) => j.rodada === r).map((j) =>
        (j.grupo_id ? `<div class="muted" style="font-size:.75rem">${esc(nomeGrupo(j.grupo_id) ?? '')}</div>` : '') + linhaJogoAdmin(j)).join('')}`).join('')}
    </div>`;
  }
  if (mata.length) {
    const rodadas = [...new Set(mata.map((j) => j.rodada))].sort((a, b) => a - b);
    html += `<div class="card"><h3>Mata-mata</h3>${rodadas.map((r) => {
      const daRodada = mata.filter((j) => j.rodada === r);
      const nConfrontos = new Set(daRodada.map((j) => j.confronto)).size;
      return `<div class="rotulo-rodada">${nomeFase(nConfrontos)}</div>${daRodada.map(linhaJogoAdmin).join('')}`;
    }).join('')}</div>`;
  }
  $('#painel').innerHTML = html || '<div class="card"><p class="muted">Sem jogos.</p></div>';
}

async function salvarResultadoPelada(jogoId) {
  const av = $('#aviso-res');
  const vCasa = $('#gols-casa').value.trim(), vFora = $('#gols-fora').value.trim();
  if (vCasa === '' || vFora === '') {
    av.textContent = 'Informe o placar dos dois times.'; av.className = 'aviso erro';
    return;
  }
  const escalacoes = [...document.querySelectorAll('#modal-conteudo .esc:checked')]
    .map((i) => ({ jogador_id: Number(i.dataset.jogador), time_id: Number(i.value) }));
  const timePorJogador = new Map(escalacoes.map((e) => [e.jogador_id, e.time_id]));
  const eventos = [];
  for (const i of document.querySelectorAll('#modal-conteudo .gols-jogador')) {
    const n = Number(i.value || 0);
    const jogadorId = Number(i.dataset.jogador);
    if (!n) continue;
    if (!timePorJogador.has(jogadorId)) {
      av.textContent = 'Ha gols atribuidos a um jogador que nao esta escalado.'; av.className = 'aviso erro';
      return;
    }
    for (let k = 0; k < n; k++) eventos.push({ tipo: 'gol', time_id: timePorJogador.get(jogadorId), jogador_id: jogadorId });
  }
  try {
    await api(`/api/jogos/${jogoId}/resultado`, 'POST', {
      gols_casa: Number(vCasa), gols_fora: Number(vFora), escalacoes, eventos,
    });
    fecharModal(); telaCampeonato(DET.campeonato.id, 'jogos');
  } catch (e) {
    av.textContent = e.message; av.className = 'aviso erro';
  }
}

async function abaSorteio() {

      <div><label>Time 2</label><select id="sorteio-fora">${SORTEIO.times.map((t, i) => `<option value="${t.id}" ${i === 1 ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></div>

      ${suplentes.length ? `<strong>Suplentes</strong><div class="grade-presenca">${suplentes.map((j) => check(j, false)).join('')}</div>` : ''}
      ${selTimes}
      <div class="linha-flex" style="margin-top:10px">

        <button class="botao secundario" onclick="sortearDia(false)">Sorteio simples</button>
      </div>
    </div>
    <div id="area-proposta"></div>
    <div class="card">
      <h3>Matriz de entrosamento</h3>
      <p class="muted">Quantos jogos cada dupla de fixos fez <strong>no mesmo time</strong> (diagonal: total de jogos do jogador).

      ${matrizHtml()}
    </div>`;

function matrizHtml() {
  const fixos = SORTEIO.fixos.map((id) => SORTEIO.jogadores.find((j) => j.id === id));
  if (fixos.length < 2) return '<p class="muted">A matriz aparece com 2 ou mais fixos ativos.</p>';
  const m = SORTEIO.matriz;
  const max = Math.max(1, ...m.flatMap((linha, i) => linha.filter((_, k) => k !== i)));
  const cor = (v, diagonal) => {
    if (diagonal) return 'background:#111;color:#fff';
    const t = Math.min(1, v / max); // frio (vermelho) -> quente (azul)
    const luz = Math.round(88 - t * 36);
    return `background:hsl(${Math.round(t * 220)},70%,${luz}%);color:${luz < 62 ? '#fff' : '#111'}`;
  };
  const curto = (nome) => nome.split(' ')[0];
  return `<div class="tabela-wrap"><table class="tabela matriz-entrosamento">
    <thead><tr><th></th>${fixos.map((j) => `<th title="${esc(j.nome)}">${esc(curto(j.nome))}</th>`).join('')}</tr></thead>
    <tbody>${fixos.map((j, i) => `<tr>
      <td class="time" title="${esc(j.nome)}"><strong>${esc(curto(j.nome))}</strong></td>
      ${fixos.map((_, k) => `<td style="${cor(m[i][k], i === k)}">${m[i][k]}</td>`).join('')}
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function moverSorteado(deTimeId, jogadorId) {
  const de = PROPOSTA.times.find((t) => t.time_id === deTimeId);
  const para = PROPOSTA.times.find((t) => t.time_id !== deTimeId);
  const i = de.jogadores.findIndex((j) => j.id === jogadorId);
  para.jogadores.push(de.jogadores.splice(i, 1)[0]);
  desenharProposta();
}

      data: $('#sorteio-data').value || null, local: $('#sorteio-local').value || null,

// Serializa os eventos ja registrados de um jogo no formato de texto,
// para o organizador editar/corrigir a partir do que ja existe.
function serializarResultadoTexto(j) {
  const evs = DET.eventos.filter((e) => e.jogo_id === j.id);
  const nomeJog = (id) => DET.jogadores.find((x) => x.id === id)?.nome ?? null;
  const secaoGols = (timeId) => {
    const linhas = [];
    const gols = evs.filter((e) => e.tipo === 'gol' && e.time_id === timeId);
    const porJogador = new Map();
    for (const g of gols) porJogador.set(g.jogador_id, (porJogador.get(g.jogador_id) ?? 0) + 1);
    for (const [jogId, qtd] of porJogador) {
      const nome = jogId != null ? nomeJog(jogId) : null;
      linhas.push(nome ? (qtd > 1 ? `${nome},${qtd}` : nome) : `SR,${qtd}`);
    }
    const contras = evs.filter((e) => e.tipo === 'gol_contra' && e.time_id === timeId);
    const gcPorJogador = new Map();
    for (const g of contras) gcPorJogador.set(g.jogador_id, (gcPorJogador.get(g.jogador_id) ?? 0) + 1);
    for (const [jogId, qtd] of gcPorJogador) {
      const nome = jogId != null ? nomeJog(jogId) : null;
      linhas.push(`GC${nome ? ',' + nome : ''}${qtd > 1 ? ',' + qtd : ''}`);
    }
    return linhas;
  };
  const secaoCartoes = (timeId) =>
    evs
      .filter((e) => (e.tipo === 'amarelo' || e.tipo === 'vermelho') && e.time_id === timeId && e.jogador_id != null)
      .map((e) => `${e.tipo === 'amarelo' ? 'A' : 'V'},${nomeJog(e.jogador_id)}`);
  return [
    'GOLS TIME CASA', ...secaoGols(j.time_casa_id),
    'GOLS TIME VISITANTE', ...secaoGols(j.time_fora_id),
    'CARTÕES TIME CASA', ...secaoCartoes(j.time_casa_id),
    'CARTÕES TIME VISITANTE', ...secaoCartoes(j.time_fora_id),
  ].join('\n');
}

// Previa do placar no cliente: conta os gols por secao (o servidor revalida tudo).
function placarDoTexto(texto) {
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
  const gols = { casa: 0, fora: 0 };
  let lado = null;
  for (const bruta of texto.split('\n')) {
    const linha = bruta.trim();
    if (!linha) continue;
    const n = norm(linha);
    if (n === 'GOLS TIME CASA') { lado = 'casa'; continue; }
    if (n === 'GOLS TIME VISITANTE') { lado = 'fora'; continue; }
    if (n === 'CARTOES TIME CASA' || n === 'CARTOES TIME VISITANTE') { lado = null; continue; }
    if (!lado) continue;
    const campos = linha.split(',').map((c) => c.trim());
    gols[lado] += campos.length > 1 && /^\d+$/.test(campos.at(-1)) ? Number(campos.at(-1)) : 1;
  }
  return gols;
}

function ligarPlacarDerivado() {
  const atualizarPlacar = () => {
    let sc = 0, sf = 0;
    for (const par of lerParciais().parciais ?? []) (par[0] > par[1] ? sc++ : sf++);
    $('#res-placar').textContent = `${sc} x ${sf}`;
  };
  document.querySelectorAll('#res-detalhado input').forEach((i) => { i.oninput = atualizarPlacar; });
  atualizarPlacar();
}

function adicionarLinhaSet() {
  const linhas = $('#linhas-sets');
  linhas.insertAdjacentHTML('beforeend', linhaSetHtml(linhas.children.length, null));
  ligarPlacarDerivado();
}

// Le as parciais preenchidas no modal, na ordem, parando na primeira linha vazia.
function lerParciais() {
  const casas = [...document.querySelectorAll('#res-detalhado .set-casa')];
  const foras = [...document.querySelectorAll('#res-detalhado .set-fora')];
  const parciais = [];
  for (let i = 0; i < casas.length; i++) {
    const a = casas[i].value.trim(), b = foras[i].value.trim();
    if (a === '' && b === '') continue;
    if (a === '' || b === '') return { erro: `Complete os dois lados do set ${i + 1}.` };
    parciais.push([Number(a), Number(b)]);
  }
  return { parciais };
}

async function salvarResultadoSets(jogoId) {

      av.textContent = lido.erro ?? 'Informe as parciais de pelo menos 1 set.'; av.className = 'aviso erro';

async function salvarResultado(jogoId) {
  const av = $('#aviso-res');
  let rota, corpo;
  if (modoResultadoAtual === 'simples') {
    const vCasa = $('#gols-casa').value.trim(), vFora = $('#gols-fora').value.trim();
    if (vCasa === '' || vFora === '') {
      av.textContent = 'Informe o placar dos dois times.'; av.className = 'aviso erro';
      return;
    }
    const j = DET.jogos.find((x) => x.id === jogoId);
    // Um evento SR (sem registro de autor) por gol, para constarem na súmula.
    const eventos = [];
    for (let k = 0; k < Number(vCasa); k++) eventos.push({ tipo: 'gol', time_id: j.time_casa_id, jogador_id: null });
    for (let k = 0; k < Number(vFora); k++) eventos.push({ tipo: 'gol', time_id: j.time_fora_id, jogador_id: null });
    rota = 'resultado'; corpo = { gols_casa: Number(vCasa), gols_fora: Number(vFora), eventos };
  } else {
    rota = 'resultado-texto'; corpo = { texto: $('#res-texto').value };
  }
  const penCasa = $('#pen-casa')?.value, penFora = $('#pen-fora')?.value;
  if (penCasa !== undefined && penCasa !== '' && penFora !== '') {
    corpo.penaltis_casa = Number(penCasa); corpo.penaltis_fora = Number(penFora);

// ---------- aba classificacao ----------

// Celula de classificacao dirigida pela chave da coluna do catalogo.
function celulaClassif(l, chave) {
  if (chave === 'ultimos') {
    const faltam = Math.max(0, 5 - l.ultimos.length);
    const bolas = '<span class="bolinha vazia"></span>'.repeat(faltam) + l.ultimos.map((r) => `<span class="bolinha ${r}"></span>`).join('');
    return `<span class="bolinhas">${bolas}</span>`;
  }
  if (chave === 'razao_sets') return razaoTexto(l.sv, l.sp);
  if (chave === 'razao_pontos') return razaoTexto(l.pp, l.pc);
  const v = l[chave];
  if (chave === 'sg' || chave.startsWith('saldo')) return `${v > 0 ? '+' : ''}${v}`;
  return String(v ?? '');
}
function razaoTexto(a, b) {
  if (b === 0) return a === 0 ? '—' : 'MAX'; // FIVB: sem set/ponto perdido
  return (a / b).toFixed(2);
}

// Zonas do ranking da pelada (RN-PE-06): medalha na premiacao, faixa no rebaixamento.
function posOuMedalha(l) {
  return l.medalha ? ['🥇', '🥈', '🥉'][l.medalha - 1] : l.pos;
}
function legendaZonas(linhas) {
  if (!linhas.some((l) => l.zona === 'rebaixamento')) return '';
  return '<p class="legenda-zonas">Linhas em vermelho: zona de rebaixamento.</p>';
}

function abaClassif() {
  const colunas = ESP?.colunas ?? [];
  $('#painel').innerHTML = DET.classificacao.map((g) => `
    <div class="card">
      ${g.grupo ? `<h3>${esc(g.grupo.nome)}</h3>` : ''}
      <div class="tabela-wrap"><table class="tabela">
        <thead><tr><th>#</th><th class="time">${esc(ESP?.rotulos.participante ?? 'Time')}</th>
          ${colunas.map(([, r, t]) => `<th title="${esc(t)}">${esc(r)}</th>`).join('')}</tr></thead>
        <tbody>${g.linhas.map((l) => {
          const t = DET.times.find((x) => x.id === l.time_id);
          const nome = ESP?.ranking === 'individual'
            ? `${esc(l.nome)}${l.goleiro ? ' <span class="badge">G</span>' : ''}`
            : `${escudoHtml(t)} ${esc(l.nome)}`;
          return `<tr${l.zona ? ` class="zona-${l.zona}"` : ''}><td>${posOuMedalha(l)}</td><td class="time">${nome}</td>
            ${colunas.map(([k]) => `<td class="${k === 'pts' ? 'pts' : ''}">${celulaClassif(l, k)}</td>`).join('')}</tr>`;
        }).join('')}</tbody>
      </table></div>
      ${legendaZonas(g.linhas)}
    </div>`).join('')
    + legendaVagas(DET.vagas, DET.classificacao)
    + cardMelhores(DET.vagas, DET.times, ESP?.rotulos.participante ?? 'Time');
}

// ---------- melhores colocados (vagas extras / corte) ----------

// Legenda das zonas da fase de grupos: verde (diretos) e ambar (em disputa).
function legendaVagas(v, classificacao) {
  if (!v || v.modo === 'inviavel') return '';
  if (!classificacao.some((g) => g.linhas.some((l) => l.zona))) return '';
  let txt = 'Linhas em verde: classificação ao mata-mata.';
  if (v.modo !== 'exata') txt += ` Linha em âmbar: ${v.posicao_disputa}º colocado, em disputa entre os grupos.`;
  return `<p class="legenda-zonas">${txt}</p>`;
}

// Rotulos das colunas por jogo do card "Melhores N-ésimos".
const ROTULOS_MEDIA = {
  pts: ['Pts/J', 'Pontos por jogo'], vitorias: ['V/J', 'Vitórias por jogo'],
  saldo: ['SG/J', 'Saldo de gols por jogo'], gols_pro: ['GP/J', 'Gols pró por jogo'],
  saldo_sets: ['ΔSets/J', 'Saldo de sets por jogo'], saldo_pontos: ['ΔPts/J', 'Saldo de pontos por jogo'],
  pontos_pro: ['PP/J', 'Pontos pró por jogo'], razao_sets: ['RSet', 'Razão de sets'],
  razao_pontos: ['RPts', 'Razão de pontos'], pct_sets: ['%Sets', 'Percentual de sets'],
  pct_pontos: ['%Pts', 'Percentual de pontos'],
};
const mediaTexto = (m) => (m == null ? 'MAX' : Number(m).toFixed(2));

// Card do ranking entre grupos (EF 5.2): ao vivo, com a linha de corte.
function cardMelhores(v, times, rotuloTime) {
  if (!v || !v.ranking?.length) return '';
  const aviso = v.grupos_desiguais
    ? ' Grupos de tamanhos diferentes: a comparação usa médias por jogo.' : '';
  return `
    <div class="card">
      <h3>Melhores ${v.posicao_disputa}ºs <span class="badge">${v.em_disputa} vaga${v.em_disputa === 1 ? '' : 's'}</span></h3>
      <p class="muted">${esc(v.resumo)}${aviso}</p>
      <div class="tabela-wrap"><table class="tabela">
        <thead><tr><th>#</th><th class="time">${esc(rotuloTime)}</th><th>Grupo</th><th title="Jogos">J</th>
          ${v.criterios_media.map((c) => `<th title="${esc(ROTULOS_MEDIA[c]?.[1] ?? c)}">${esc(ROTULOS_MEDIA[c]?.[0] ?? c)}</th>`).join('')}</tr></thead>
        <tbody>${v.ranking.map((l, i) => {
          const t = times?.find((x) => x.id === l.time_id);
          const classes = [l.classifica ? 'zona-classifica' : '', i === v.em_disputa ? 'linha-corte' : '']
            .filter(Boolean).join(' ');
          return `<tr${classes ? ` class="${classes}"` : ''}><td>${i + 1}</td>
            <td class="time">${t ? escudoHtml(t) : ''} ${esc(l.nome)}</td>
            <td>${esc((l.grupo_nome ?? '').replace('Grupo ', ''))}</td><td>${l.pj}</td>
            ${v.criterios_media.map((c) => `<td>${mediaTexto(l.medias[c])}</td>`).join('')}</tr>`;
        }).join('')}</tbody>
      </table></div>
      <p class="legenda-zonas">Acima da linha de corte: ${v.modo === 'corte' ? 'avançam ao mata-mata' : 'levam as vagas extras'}. As vagas só se confirmam com todos os jogos dos grupos encerrados.</p>
    </div>`;
}

async function salvarConfig() {
  const dados = {
    nome: $('#cfg-nome').value, temporada: $('#cfg-temporada').value || null,
    descricao: $('#cfg-descricao').value || null, cor_tema: $('#cfg-cor').value,
    publicado: $('#cfg-publicado').checked,
    aceita_conexoes: $('#cfg-aceita-conexoes').checked,
  };
  if ($('#cfg-premiacao')) { // card da pelada (premiacao e rebaixamento)
    dados.premiacao = $('#cfg-premiacao').value;
    dados.premia_artilheiro = $('#cfg-premia-artilheiro').checked;
    dados.rebaixamento_modo = $('#cfg-rebaixamento-modo').value || null;
    dados.rebaixamento_qtd = Number($('#cfg-rebaixamento-qtd').value || 0) || null;
  }
  try {
    await api(`/api/campeonatos/${DET.campeonato.id}`, 'PATCH', dados);
    avisar('Alterações salvas!'); telaCampeonato(DET.campeonato.id, 'config');
  } catch (e) { avisar(e.message); }
}
// ---------- colaboradores (RN-CO) ----------

function flagColab(id, rotulo, marcado) {
  return `<label style="font-weight:400;display:inline-flex;gap:5px;align-items:center;margin:0">
    <input type="checkbox" id="${id}" ${marcado ? 'checked' : ''} style="width:auto">${rotulo}</label>`;
}
function linhaColaborador(col, ehPelada) {
  const corPend = col.status === 'pendente' ? 'background:#fef3c7;color:#92400e' : '';
  return `<div style="border-bottom:1px solid var(--borda);padding:10px 0">
    <div class="linha-flex">
      <strong style="overflow-wrap:anywhere">${esc(col.email)}</strong>
      <span class="badge" style="${corPend}" title="${col.status === 'pendente' ? 'A pessoa ainda não criou/confirmou a conta com este e-mail' : ''}">${col.status}</span>
      <span class="espacador"></span>
      <button class="botao perigo mini" onclick="removerColaborador(${col.id})">Remover</button>
    </div>
    <div class="linha-flex" style="gap:12px;margin-top:6px;flex-wrap:wrap">
      ${flagColab(`colab-${col.id}-jogos`, 'Jogos', col.pode_jogos)}
      ${flagColab(`colab-${col.id}-times`, 'Times', col.pode_times)}
      ${flagColab(`colab-${col.id}-regras`, 'Regras', col.pode_regras)}
      ${ehPelada ? flagColab(`colab-${col.id}-sorteio`, 'Sorteio', col.pode_sorteio) : ''}
      <button class="botao secundario mini" onclick="salvarFlagsColaborador(${col.id})">Salvar acessos</button>
    </div>
  </div>`;
}
async function convidarColaborador() {
  const c = DET.campeonato;
  try {
    await api(`/api/campeonatos/${c.id}/colaboradores`, 'POST', {
      email: ($('#colab-email').value || '').trim(),
      pode_jogos: $('#colab-novo-jogos')?.checked,
      pode_times: $('#colab-novo-times')?.checked,
      pode_regras: $('#colab-novo-regras')?.checked,
      pode_sorteio: $('#colab-novo-sorteio')?.checked,
    });
    avisar('Convite enviado!'); telaCampeonato(c.id, 'config');
  } catch (e) { avisar(e.message); }
}
async function salvarFlagsColaborador(cid) {
  const c = DET.campeonato;
  try {
    await api(`/api/campeonatos/${c.id}/colaboradores/${cid}`, 'PATCH', {
      pode_jogos: $(`#colab-${cid}-jogos`)?.checked,
      pode_times: $(`#colab-${cid}-times`)?.checked,
      pode_regras: $(`#colab-${cid}-regras`)?.checked,
      pode_sorteio: $(`#colab-${cid}-sorteio`)?.checked,
    });
    avisar('Acessos atualizados!');
  } catch (e) { avisar(e.message); }
}
async function removerColaborador(cid) {
  if (!confirm('Remover este colaborador? Ele perde o acesso imediatamente.')) return;
  const c = DET.campeonato;
  try {
    await api(`/api/campeonatos/${c.id}/colaboradores/${cid}`, 'DELETE');
    avisar('Colaborador removido.'); telaCampeonato(c.id, 'config');
  } catch (e) { avisar(e.message); }

async function enviarLogo() {
  try {
    const imagem = await lerArquivo($('#arq-logo'));
    await api(`/api/campeonatos/${DET.campeonato.id}/logo`, 'POST', { imagem });
    avisar('Logo atualizada!'); telaCampeonato(DET.campeonato.id, 'config');

// ---------- encerramento com podio (EF Perfil do Atleta, fase A) ----------

// Participantes elegiveis ao podio: times, ou jogadores FIXOS na Pelada Epica.
function participantesPodio() {
  return ESP?.ranking === 'individual'
    ? DET.jogadores.filter((j) => j.tipo === 'fixo')
    : DET.times;
}
function nomePodio(id) {
  return participantesPodio().find((p) => p.id === id)?.nome ?? '—';
}

function cardEncerramento(enc) {
  if (enc.encerrado) {
    const linha = (medalha, id) => `
      <div style="padding:3px 0">${medalha} <strong>${esc(nomePodio(id))}</strong></div>`;
    return `
      <p class="muted">Encerrado em ${formatarData(enc.encerrado_em.replace(' ', 'T'))}. O pódio aparece na página pública.</p>
      ${enc.podio?.primeiro ? linha('🥇', enc.podio.primeiro) : ''}
      ${enc.podio?.segundo ? linha('🥈', enc.podio.segundo) : ''}
      ${enc.podio?.terceiro ? linha('🥉', enc.podio.terceiro) : ''}
      <p><button class="botao secundario" onclick="reabrirCampeonato()">Reabrir campeonato</button></p>
      <p class="muted">Reabrir descarta o pódio; ele será declarado de novo no próximo encerramento.</p>`;
  }
  if (enc.fim_definido) {
    return `
      <p class="muted">Todos os jogos têm resultado. Encerre o campeonato para declarar o pódio
      (1º, 2º e 3º lugar) — ele passa a aparecer na página pública.</p>
      <p><button class="botao" onclick="modalEncerramento(false)">Encerrar campeonato</button></p>`;
  }
  return `<p class="muted">${enc.jogos_pendentes > 0
    ? `Ainda há ${enc.jogos_pendentes} jogo(s) sem resultado. Quando todos os jogos forem encerrados, você poderá encerrar o campeonato e declarar o pódio.`
    : 'O campeonato ainda não tem jogos realizados; não há o que encerrar por enquanto.'}</p>`;
}

// Modal de encerramento: selects do podio pre-preenchidos com a sugestao do
// servidor (RN-AT-13). excluirDepois: fluxo "Encerrar e excluir" (EF 3.5).
async function modalEncerramento(excluirDepois) {
  const c = DET.campeonato;
  let sugestao = { primeiro: null, segundo: null, terceiro: null };
  try { sugestao = (await api(`/api/campeonatos/${c.id}/encerramento`)).sugestao ?? sugestao; }
  catch (e) { avisar(e.message); return; }
  const opcoes = (marcado) => ['<option value="">—</option>', ...participantesPodio()
    .map((p) => `<option value="${p.id}" ${p.id === marcado ? 'selected' : ''}>${esc(p.nome)}</option>`)].join('');
  abrirModal(`
    <h3>Encerrar ${esc(c.nome)}</h3>
    <p class="muted">Confirme o pódio — preenchemos com o resultado da competição, ajuste se precisar.
    ${excluirDepois ? 'Depois de encerrado, o campeonato será excluído.' : ''}</p>
    <label>🥇 Campeão (1º lugar)</label><select id="podio-primeiro">${opcoes(sugestao.primeiro)}</select>
    <label>🥈 2º lugar (opcional)</label><select id="podio-segundo">${opcoes(sugestao.segundo)}</select>
    <label>🥉 3º lugar (opcional)</label><select id="podio-terceiro">${opcoes(sugestao.terceiro)}</select>
    <p><button class="botao" onclick="confirmarEncerramento(${excluirDepois ? 'true' : 'false'})">
      ${excluirDepois ? 'Encerrar e excluir' : 'Encerrar campeonato'}</button>
    <button class="botao secundario" onclick="fecharModal()">Cancelar</button></p>`);
}

async function confirmarEncerramento(excluirDepois) {
  const c = DET.campeonato;
  const valor = (id) => $(id).value ? Number($(id).value) : null;
  try {
    await api(`/api/campeonatos/${c.id}/encerrar`, 'POST', {
      primeiro: valor('#podio-primeiro'), segundo: valor('#podio-segundo'), terceiro: valor('#podio-terceiro'),
    });
    fecharModal();
    if (excluirDepois) {
      await api(`/api/campeonatos/${c.id}`, 'DELETE');
      avisar('Campeonato encerrado e excluído. O pódio foi registrado.');
      telaLista();
    } else {
      avisar('Campeonato encerrado! O pódio já aparece na página pública.');
      telaCampeonato(c.id, 'config');
    }
  } catch (e) { avisar(e.message); }
}

async function reabrirCampeonato() {
  if (!confirm('Reabrir este campeonato? O pódio atual será descartado.')) return;
  try {
    await api(`/api/campeonatos/${DET.campeonato.id}/reabrir`, 'POST');
    avisar('Campeonato reaberto.'); telaCampeonato(DET.campeonato.id, 'config');
  } catch (e) { avisar(e.message); }
}

// Exclusao sensivel ao estado (EF 3.5, RN-AT-10): copa com fim definido e nunca
// encerrada ganha o dialogo de tres opcoes antes de excluir.
async function excluirCampeonato() {
  const c = DET.campeonato;
  let enc = null;
  try { enc = await api(`/api/campeonatos/${c.id}/encerramento`); }
  catch { /* sem estado (ex.: erro transitorio): cai na exclusao direta */ }
  if (enc && !enc.encerrado && enc.fim_definido) {
    abrirModal(`
      <h3>Excluir ${esc(c.nome)}</h3>
      <p>Você está prestes a excluir uma competição que teve seu fim definido.
      Deseja <strong>encerrar esta Copa</strong> antes de excluí-la?
      Isso envia o título aos atletas da competição.</p>
      <p style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="botao" onclick="fecharModal();modalEncerramento(true)">Encerrar e excluir</button>
        <button class="botao perigo" onclick="fecharModal();excluirDireto()">Apenas excluir</button>
        <button class="botao secundario" onclick="fecharModal()">Cancelar</button></p>`);
    return;
  }
  excluirDireto();
}

async function excluirDireto() {
  if (!confirm(`Excluir "${DET.campeonato.nome}" definitivamente?`)) return;
  if (!confirm('Tem certeza MESMO? Esta ação não pode ser desfeita.')) return;
  try { await api(`/api/campeonatos/${DET.campeonato.id}`, 'DELETE'); telaLista(); }
  catch (e) { avisar(e.message); }
}

    <div class="grid-2">
      <div><label>Papel</label>
      <select id="cta-papel" ${cta.id === EU.id ? 'disabled title="Você não pode rebaixar a si mesmo"' : ''}>
        <option value="organizador" ${cta.papel === 'organizador' ? 'selected' : ''}>Organizador</option>
        <option value="master" ${cta.papel === 'master' ? 'selected' : ''}>Master</option>
      </select></div>
      <div><label>Tipo de conta</label>
      <select id="cta-tipo">
        ${Object.entries(TIPOS_CONTA_UI).map(([chave, [rotulo, n]]) =>
          `<option value="${chave}" ${cta.tipo === chave ? 'selected' : ''}>${rotulo} (${n} campeonatos)</option>`).join('')}
      </select></div>
    </div>
    <p class="muted" style="margin:8px 0 0">Limites personalizados (vazio = padrão do tipo/plataforma):</p>
    <div class="grid-2">
      <div><label>Campeonatos</label>
        <input type="number" id="cta-max-campeonatos" min="1" value="${cta.max_campeonatos ?? ''}" placeholder="padrão do tipo"></div>
      <div><label>Times por campeonato</label>
        <input type="number" id="cta-max-times" min="1" value="${cta.max_times ?? ''}" placeholder="padrão: 48"></div>
      <div><label>Jogadores por time</label>
        <input type="number" id="cta-max-jogadores" min="1" value="${cta.max_jogadores_time ?? ''}" placeholder="padrão: 30"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px">
      <input type="checkbox" id="cta-banners" ${cta.banners_liberados ? 'checked' : ''} style="width:auto">
      <span>Liberar a seção <strong>Banners</strong> para esta conta (anúncios nos campeonatos dela)</span>
    </label>
    <p><button class="botao" style="width:100%" onclick="salvarConta(${contaId})">Salvar</button></p>
  `);
}
async function salvarConta(contaId) {
  try {
    const corpo = {
      nome: $('#cta-nome').value,
      email: $('#cta-email').value,
      tipo: $('#cta-tipo').value,
      max_campeonatos: $('#cta-max-campeonatos').value || null,
      max_times: $('#cta-max-times').value || null,
      max_jogadores_time: $('#cta-max-jogadores').value || null,
      banners_liberados: $('#cta-banners').checked,
    };
    if (!$('#cta-papel').disabled) corpo.papel = $('#cta-papel').value;
    await api(`/api/master/contas/${contaId}`, 'PATCH', corpo);
    fecharModal(); telaMaster();
  } catch (e) { avisar(e.message); }
}
// Dados da conta sempre buscados pela lista em memória: interpolar o nome
// dentro de um atributo onclick permitiria injetar código via nome da conta.
const contaMaster = (contaId) => window._contasMaster.find((x) => x.id === contaId);

async function resetarSenha(contaId) {
  const nome = contaMaster(contaId)?.nome ?? 'esta conta';
  if (!confirm(`Resetar a senha de ${nome}? A senha atual deixa de valer e todas as sessões serão encerradas.`)) return;
  try {
    const r = await api(`/api/master/contas/${contaId}/resetar-senha`, 'POST');
    abrirModal(`
      <h3>🔑 Senha temporária de ${esc(nome)}</h3>
      <p style="text-align:center;font-size:1.5rem"><code>${esc(r.senha_temporaria)}</code></p>
      <p class="muted">Anote e repasse com segurança — ela não será exibida de novo.
      Oriente a pessoa a trocá-la após entrar.</p>
      <p><button class="botao" style="width:100%" onclick="navigator.clipboard.writeText('${esc(r.senha_temporaria)}').then(()=>avisar('Senha copiada!'))">Copiar senha</button></p>
    `);
  } catch (e) { avisar(e.message); }
}
async function encerrarSessoes(contaId) {
  const nome = contaMaster(contaId)?.nome ?? 'esta conta';
  if (!confirm(`Encerrar todas as sessões de ${nome}? A pessoa precisará fazer login de novo.`)) return;
  try {
    const r = await api(`/api/master/contas/${contaId}/encerrar-sessoes`, 'POST');
    avisar(`${r.sessoes_encerradas} sessão(ões) encerrada(s).`);
  } catch (e) { avisar(e.message); }
}
async function excluirConta(contaId) {
  const cta = contaMaster(contaId);
  const nome = cta?.nome ?? 'esta conta';
  const nCampeonatos = cta?.n_campeonatos ?? 0;
  if (!confirm(`Excluir a conta de ${nome}? Isso apaga ${nCampeonatos} campeonato(s) com times, jogos e banners. NÃO TEM VOLTA.`)) return;
  if (!confirm('Tem certeza MESMO? Esta ação é definitiva.')) return;
  try { await api(`/api/master/contas/${contaId}`, 'DELETE'); telaMaster(); }
  catch (e) { avisar(e.message); }
}

// ================= INICIO =================

$('#btn-sair').onclick = async () => { await api('/api/auth/sair', 'POST'); location.href = '/'; };

// Intencao de "seguir" guardada quando um visitante anonimo clicou em "Seguir
// esta Copa" e foi mandado ao login (RN-SG-05). Todo login (senha e Google)
// termina aqui em /admin, entao efetivamos o vinculo e devolvemos a pessoa a
// copa. Ignora intencao velha (> 1h) para nao seguir algo ja esquecido.
async function executarSeguirPendente() {
  let intencao = null;
  try { intencao = JSON.parse(localStorage.getItem('cm_seguir_pendente') || 'null'); } catch {}
  try { localStorage.removeItem('cm_seguir_pendente'); } catch {}
  if (!intencao?.slug || !intencao.em || Date.now() - intencao.em > 60 * 60 * 1000) return false;
  try { await fetch(`/api/seguir/${encodeURIComponent(intencao.slug)}`, { method: 'POST' }); } catch {}
  location.href = `/c/${encodeURIComponent(intencao.slug)}`;
  return true;
}

async function iniciarPainel() {
  if (await executarSeguirPendente()) return; // seguiu e voltou para a copa
  EU = await api('/api/auth/eu');
  $('#ola').textContent = EU.tenant
    ? `Olá! (como ${EU.tenant.nome.split(' ')[0]})`
    : `Olá, ${EU.nome.split(' ')[0]}!${EU.master ? ' 👑' : ''}`;
  barraMaster();
  if (EU.master && !EU.tenant) return telaMaster();
  return telaLista();
}

iniciarPainel().catch(() => { location.href = '/'; });
</script>
