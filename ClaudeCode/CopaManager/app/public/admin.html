<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let DET = null;      // detalhe do campeonato aberto
let abaAtual = 'jogos';

async function api(url, metodo = 'GET', corpo = null) {
  const resp = await fetch(url, {
    method: metodo,
    headers: corpo ? { 'Content-Type': 'application/json' } : {},
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (resp.status === 401) { location.href = '/'; throw new Error('Sessão expirada.'); }
  const dados = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(dados.mensagem || 'Erro inesperado.');
  return dados;
}

const avisar = (msg) => alert(msg);

// Le um <input type=file> e devolve data URL (para upload de imagem).
function lerArquivo(input) {
  return new Promise((resolve, reject) => {
    const arq = input.files?.[0];
    if (!arq) return reject(new Error('Escolha uma imagem.'));
    if (arq.size > 3 * 1024 * 1024) return reject(new Error('Imagem muito grande (limite 3 MB).'));
    const leitor = new FileReader();
    leitor.onload = () => resolve(leitor.result);
    leitor.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
    leitor.readAsDataURL(arq);
  });
}

function abrirModal(html) { $('#modal-conteudo').innerHTML = html; $('#modal-fundo').classList.add('aberto'); }
function fecharModal() { $('#modal-fundo').classList.remove('aberto'); }
$('#modal-fundo').onclick = (e) => { if (e.target === $('#modal-fundo')) fecharModal(); };

const nomeTime = (id) => DET?.times.find((t) => t.id === id)?.nome ?? 'A definir';
function escudoHtml(t) {
  if (t?.escudo) return `<img class="escudo" src="${esc(t.escudo)}" alt="">`;
  return `<span class="escudo-placeholder">${t ? esc(t.nome[0].toUpperCase()) : '?'}</span>`;
}
const nomeFase = (n) => ({ 1: 'Final', 2: 'Semifinal', 4: 'Quartas de final', 8: 'Oitavas de final' }[n] || `Fase de ${n * 2} times`);

// LGPD: exclusao da propria conta e de todos os dados (art. 18).
function modalExcluirConta() {
  abrirModal(`
    <h3>Excluir minha conta</h3>
    <p>Isso apaga <strong>definitivamente</strong> sua conta e todos os seus campeonatos,

    <label>Confirme com sua senha (contas Google: digite o e-mail da conta)</label>

  `);
}
async function excluirMinhaConta() {
  if (!confirm('Tem certeza MESMO? Todos os seus dados serão apagados.')) return;
  try {
    await api('/api/auth/minha-conta', 'DELETE', { confirmacao: $('#excluir-confirmacao').value });
    location.href = '/';
  } catch (e) {
    const av = $('#aviso-excluir'); av.textContent = e.message; av.className = 'aviso erro';
  }
}

// ---------- aba jogos ----------

function linhaJogoAdmin(j) {
  const casa = DET.times.find((t) => t.id === j.time_casa_id);
  const fora = DET.times.find((t) => t.id === j.time_fora_id);
  const placar = j.status === 'encerrado' ? `${j.gols_casa} x ${j.gols_fora}` : (j.data ? esc(j.data.replace('T', ' ')) : 'A definir');
  const prontos = j.time_casa_id && j.time_fora_id;
  return `<div class="jogo" style="cursor:default">
    <span class="mandante">${esc(casa?.nome ?? 'A definir')} ${escudoHtml(casa)}</span>
    <span class="placar ${j.status}">${placar}${j.penaltis_casa != null ? `<div class="muted" style="font-size:.68rem">(${j.penaltis_casa}x${j.penaltis_fora} pen)</div>` : ''}</span>
    <span class="visitante">${escudoHtml(fora)} ${esc(fora?.nome ?? 'A definir')}</span>
    <span style="display:flex;gap:4px;flex-wrap:wrap">
      ${prontos ? `<button class="botao mini" onclick="modalResultado(${j.id})">${j.status === 'encerrado' ? 'Corrigir' : 'Lançar resultado'}</button>` : ''}
      <button class="botao secundario mini" onclick="modalAgenda(${j.id})">Agenda</button>
      ${j.status === 'encerrado' ? `<button class="botao secundario mini" onclick="modalSumula(${j.id})">Súmula${j.sumula ? ' ✓' : ''}</button>
      <button class="botao perigo mini" onclick="apagarResultado(${j.id})">Apagar</button>` : ''}
    </span>
  </div>`;
}

function abaJogos() {
  const c = DET.campeonato;
  const grupos = DET.jogos.filter((j) => j.fase === 'grupos');
  const mata = DET.jogos.filter((j) => j.fase === 'mata');
  let html = '';

  if (c.formato === 'grupos_mata' && !mata.length) {
    const pendentes = grupos.filter((j) => j.status !== 'encerrado').length;
    html += `<div class="card linha-flex">
      <span>Fase de grupos: <strong>${grupos.length - pendentes}/${grupos.length}</strong> jogos com resultado.</span>
      <span class="espacador"></span>
      <button class="botao" ${pendentes ? 'disabled' : ''} onclick="gerarMata()">Gerar mata-mata 🏆</button>
    </div>`;
  }

  if (grupos.length) {
    const rodadas = [...new Set(grupos.map((j) => j.rodada))].sort((a, b) => a - b);
    const nomeGrupo = (gid) => DET.grupos.find((g) => g.id === gid)?.nome;
    html += `<div class="card">${rodadas.map((r) => `
      <div class="rotulo-rodada">Rodada ${r}</div>
      ${grupos.filter((j) => j.rodada === r).map((j) =>
        (j.grupo_id ? `<div class="muted" style="font-size:.75rem">${esc(nomeGrupo(j.grupo_id) ?? '')}</div>` : '') + linhaJogoAdmin(j)).join('')}`).join('')}
    </div>`;
  }
  if (mata.length) {
    const rodadas = [...new Set(mata.map((j) => j.rodada))].sort((a, b) => a - b);
    html += `<div class="card"><h3>Mata-mata</h3>${rodadas.map((r) => {
      const daRodada = mata.filter((j) => j.rodada === r);
      const nConfrontos = new Set(daRodada.map((j) => j.confronto)).size;
      return `<div class="rotulo-rodada">${nomeFase(nConfrontos)}</div>${daRodada.map(linhaJogoAdmin).join('')}`;
    }).join('')}</div>`;
  }
  $('#painel').innerHTML = html || '<div class="card"><p class="muted">Sem jogos.</p></div>';
}

async function gerarMata() {
  if (!confirm('Gerar o mata-mata com os classificados atuais? A fase de grupos será considerada encerrada.')) return;
  try { await api(`/api/campeonatos/${DET.campeonato.id}/gerar-mata`, 'POST'); telaCampeonato(DET.campeonato.id, 'jogos'); }
  catch (e) { avisar(e.message); }
}

// Serializa os eventos ja registrados de um jogo no formato de texto,
// para o organizador editar/corrigir a partir do que ja existe.
function serializarResultadoTexto(j) {
  const evs = DET.eventos.filter((e) => e.jogo_id === j.id);
  const nomeJog = (id) => DET.jogadores.find((x) => x.id === id)?.nome ?? null;
  const secaoGols = (timeId) => {
    const linhas = [];
    const gols = evs.filter((e) => e.tipo === 'gol' && e.time_id === timeId);
    const porJogador = new Map();
    for (const g of gols) porJogador.set(g.jogador_id, (porJogador.get(g.jogador_id) ?? 0) + 1);
    for (const [jogId, qtd] of porJogador) {
      const nome = jogId != null ? nomeJog(jogId) : null;
      linhas.push(nome ? (qtd > 1 ? `${nome},${qtd}` : nome) : `SR,${qtd}`);
    }
    const contras = evs.filter((e) => e.tipo === 'gol_contra' && e.time_id === timeId);
    const gcPorJogador = new Map();
    for (const g of contras) gcPorJogador.set(g.jogador_id, (gcPorJogador.get(g.jogador_id) ?? 0) + 1);
    for (const [jogId, qtd] of gcPorJogador) {
      const nome = jogId != null ? nomeJog(jogId) : null;
      linhas.push(`GC${nome ? ',' + nome : ''}${qtd > 1 ? ',' + qtd : ''}`);
    }
    return linhas;
  };
  const secaoCartoes = (timeId) =>
    evs
      .filter((e) => (e.tipo === 'amarelo' || e.tipo === 'vermelho') && e.time_id === timeId && e.jogador_id != null)
      .map((e) => `${e.tipo === 'amarelo' ? 'A' : 'V'},${nomeJog(e.jogador_id)}`);
  return [
    'GOLS TIME CASA', ...secaoGols(j.time_casa_id),
    'GOLS TIME VISITANTE', ...secaoGols(j.time_fora_id),
    'CARTÕES TIME CASA', ...secaoCartoes(j.time_casa_id),
    'CARTÕES TIME VISITANTE', ...secaoCartoes(j.time_fora_id),
  ].join('\n');
}

// Previa do placar no cliente: conta os gols por secao (o servidor revalida tudo).
function placarDoTexto(texto) {
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
  const gols = { casa: 0, fora: 0 };
  let lado = null;
  for (const bruta of texto.split('\n')) {
    const linha = bruta.trim();
    if (!linha) continue;
    const n = norm(linha);
    if (n === 'GOLS TIME CASA') { lado = 'casa'; continue; }
    if (n === 'GOLS TIME VISITANTE') { lado = 'fora'; continue; }
    if (n === 'CARTOES TIME CASA' || n === 'CARTOES TIME VISITANTE') { lado = null; continue; }
    if (!lado) continue;
    const campos = linha.split(',').map((c) => c.trim());
    gols[lado] += campos.length > 1 && /^\d+$/.test(campos.at(-1)) ? Number(campos.at(-1)) : 1;
  }
  return gols;
}

        Um lançamento por linha, dentro de cada seção. Gols: <code>Nome,quantidade</code>
        (quantidade opcional) • <code>GC,Nome</code> = gol contra (jogador do outro time) •
        <code>SR,2</code> = gols sem registro de autor. Cartões: <code>A,Nome</code> (amarelo)
        ou <code>V,Nome</code> (vermelho).
      </p>
      <textarea id="res-texto" rows="14" spellcheck="false" style="font-family:Consolas,monospace;font-size:.85rem">${esc(serializarResultadoTexto(j))}</textarea>
      <p style="text-align:center;font-size:1.1rem"><strong>Placar: ${esc(casa.nome)} <span id="res-placar">0 x 0</span> ${esc(fora.nome)}</strong><br>

    </div>
    ${j.fase === 'mata' ? `
    <p class="muted">Se o confronto terminar empatado, informe os pênaltis:</p>
    <div class="grid-2">
      <div><label>Pênaltis ${esc(casa.nome)}</label><input type="number" id="pen-casa" min="0" value="${j.penaltis_casa ?? ''}"></div>
      <div><label>Pênaltis ${esc(fora.nome)}</label><input type="number" id="pen-fora" min="0" value="${j.penaltis_fora ?? ''}"></div>
    </div>` : ''}
    <div id="aviso-res" class="aviso"></div>
    <p><button class="botao" style="width:100%" onclick="salvarResultado(${jogoId})">Salvar resultado</button></p>
  `);
  const atualizarPlacar = () => {
    const p = placarDoTexto($('#res-texto').value);
    $('#res-placar').textContent = `${p.casa} x ${p.fora}`;
  };
  $('#res-texto').oninput = atualizarPlacar;
  atualizarPlacar();
  modoResultado(temDetalhe ? 'detalhado' : 'simples');
}

async function salvarResultado(jogoId) {
  const av = $('#aviso-res');
  let rota, corpo;
  if (modoResultadoAtual === 'simples') {
    const vCasa = $('#gols-casa').value.trim(), vFora = $('#gols-fora').value.trim();
    if (vCasa === '' || vFora === '') {
      av.textContent = 'Informe o placar dos dois times.'; av.className = 'aviso erro';
      return;
    }
    const j = DET.jogos.find((x) => x.id === jogoId);
    // Um evento SR (sem registro de autor) por gol, para constarem na súmula.
    const eventos = [];
    for (let k = 0; k < Number(vCasa); k++) eventos.push({ tipo: 'gol', time_id: j.time_casa_id, jogador_id: null });
    for (let k = 0; k < Number(vFora); k++) eventos.push({ tipo: 'gol', time_id: j.time_fora_id, jogador_id: null });
    rota = 'resultado'; corpo = { gols_casa: Number(vCasa), gols_fora: Number(vFora), eventos };
  } else {
    rota = 'resultado-texto'; corpo = { texto: $('#res-texto').value };
  }
  const penCasa = $('#pen-casa')?.value, penFora = $('#pen-fora')?.value;
  if (penCasa !== undefined && penCasa !== '' && penFora !== '') {
    corpo.penaltis_casa = Number(penCasa); corpo.penaltis_fora = Number(penFora);
  }
  try {
    await api(`/api/jogos/${jogoId}/${rota}`, 'POST', corpo);
    fecharModal(); telaCampeonato(DET.campeonato.id, 'jogos');
  } catch (e) {
    av.textContent = e.message; av.className = 'aviso erro';
  }
}

    <h3>Editar conta</h3>
    <label>Nome</label><input type="text" id="cta-nome" value="${esc(cta.nome)}">
    <label>E-mail</label><input type="email" id="cta-email" value="${esc(cta.email)}">
    <label>Papel</label>
    <select id="cta-papel" ${cta.id === EU.id ? 'disabled title="Você não pode rebaixar a si mesmo"' : ''}>
      <option value="organizador" ${cta.papel === 'organizador' ? 'selected' : ''}>Organizador</option>
      <option value="master" ${cta.papel === 'master' ? 'selected' : ''}>Master</option>
    </select>
    <p><button class="botao" style="width:100%" onclick="salvarConta(${contaId})">Salvar</button></p>
  `);
}
async function salvarConta(contaId) {
  try {
    const corpo = { nome: $('#cta-nome').value, email: $('#cta-email').value };
    if (!$('#cta-papel').disabled) corpo.papel = $('#cta-papel').value;
    await api(`/api/master/contas/${contaId}`, 'PATCH', corpo);
    fecharModal(); telaMaster();
  } catch (e) { avisar(e.message); }
}
// Dados da conta sempre buscados pela lista em memória: interpolar o nome
// dentro de um atributo onclick permitiria injetar código via nome da conta.
const contaMaster = (contaId) => window._contasMaster.find((x) => x.id === contaId);

async function resetarSenha(contaId) {
  const nome = contaMaster(contaId)?.nome ?? 'esta conta';
  if (!confirm(`Resetar a senha de ${nome}? A senha atual deixa de valer e todas as sessões serão encerradas.`)) return;
  try {
    const r = await api(`/api/master/contas/${contaId}/resetar-senha`, 'POST');
    abrirModal(`
      <h3>🔑 Senha temporária de ${esc(nome)}</h3>
      <p style="text-align:center;font-size:1.5rem"><code>${esc(r.senha_temporaria)}</code></p>
      <p class="muted">Anote e repasse com segurança — ela não será exibida de novo.
      Oriente a pessoa a trocá-la após entrar.</p>
      <p><button class="botao" style="width:100%" onclick="navigator.clipboard.writeText('${esc(r.senha_temporaria)}').then(()=>avisar('Senha copiada!'))">Copiar senha</button></p>
    `);
  } catch (e) { avisar(e.message); }
}
async function encerrarSessoes(contaId) {
  const nome = contaMaster(contaId)?.nome ?? 'esta conta';
  if (!confirm(`Encerrar todas as sessões de ${nome}? A pessoa precisará fazer login de novo.`)) return;
  try {
    const r = await api(`/api/master/contas/${contaId}/encerrar-sessoes`, 'POST');
    avisar(`${r.sessoes_encerradas} sessão(ões) encerrada(s).`);
  } catch (e) { avisar(e.message); }
}
async function excluirConta(contaId) {
  const cta = contaMaster(contaId);
  const nome = cta?.nome ?? 'esta conta';
  const nCampeonatos = cta?.n_campeonatos ?? 0;
  if (!confirm(`Excluir a conta de ${nome}? Isso apaga ${nCampeonatos} campeonato(s) com times, jogos e banners. NÃO TEM VOLTA.`)) return;
  if (!confirm('Tem certeza MESMO? Esta ação é definitiva.')) return;
  try { await api(`/api/master/contas/${contaId}`, 'DELETE'); telaMaster(); }
  catch (e) { avisar(e.message); }
}

// ================= INICIO =================

$('#btn-sair').onclick = async () => { await api('/api/auth/sair', 'POST'); location.href = '/'; };

async function iniciarPainel() {
  EU = await api('/api/auth/eu');
  $('#ola').textContent = EU.tenant
    ? `Olá! (como ${EU.tenant.nome.split(' ')[0]})`
    : `Olá, ${EU.nome.split(' ')[0]}!${EU.master ? ' 👑' : ''}`;
  barraMaster();
  if (EU.master && !EU.tenant) return telaMaster();
  return telaLista();
}

iniciarPainel().catch(() => { location.href = '/'; });
</script>
</body>
