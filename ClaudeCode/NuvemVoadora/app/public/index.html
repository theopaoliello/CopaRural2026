<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuvem Voadora — HUB</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    a.metric { text-decoration: none; color: inherit; display: block; }
    a.metric:hover { background: #f2f5fb; border-radius: 8px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip-f { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--borda); background: #fff; cursor: pointer; font-size: 13px; }
    .chip-f.ativo { background: var(--azul); color: #fff; border-color: var(--azul); }
  </style>
</head>
<body>
  <header class="topo"></header>
  <main>
    <h2>Painel</h2>
    <div class="card">
      <div class="grid" id="metricas">
        <div class="metric"><div class="n">—</div><div class="l">carregando</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Ordens de Serviço</h2>
      <div class="chips" id="filtros">
        <span class="chip-f ativo" data-s="">Todas</span>
        <span class="chip-f" data-s="PENDENTE">Pendentes</span>
        <span class="chip-f" data-s="LIBERADA_SEPARACAO">Na fila</span>
        <span class="chip-f" data-s="EM_SEPARACAO">Em separação</span>
        <span class="chip-f" data-s="PRONTA_DESPACHO">Prontas</span>
      </div>
      <table>
        <thead><tr><th>Código</th><th>Cliente</th><th>Partes</th><th>Status</th><th>Atraso</th><th>Aberta</th></tr></thead>
        <tbody id="lista"><tr><td colspan="6" class="suave">Carregando…</td></tr></tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function metricas() {
      const r = await api('/resumo');
      document.getElementById('metricas').innerHTML = `
        <a class="metric" href="#" data-f="PENDENTE"><div class="n">${r.pendentes}</div><div class="l">Pendentes</div></a>
        <a class="metric" href="separacao.html"><div class="n">${r.fila_separacao}</div><div class="l">Na fila</div></a>
        <a class="metric" href="#" data-f="EM_SEPARACAO"><div class="n">${r.em_separacao}</div><div class="l">Em separação</div></a>
        <a class="metric" href="#" data-f="PRONTA_DESPACHO"><div class="n">${r.prontas}</div><div class="l">Prontas p/ despacho</div></a>
        <a class="metric alerta" href="atrasos.html"><div class="n">${r.atrasadas}</div><div class="l">Atrasadas</div></a>`;
      document.querySelectorAll('#metricas a[data-f]').forEach((a) => {
        a.onclick = (e) => { e.preventDefault(); filtrar(a.dataset.f); };
      });
    }

    async function listar(status) {
      const oss = await api('/os' + (status ? '?status=' + status : ''));
      const tb = document.getElementById('lista');
      tb.innerHTML = oss.length ? oss.map((o) => `
        <tr>
          <td><a href="os.html?codigo=${o.codigo}" class="mono">${o.codigo}</a></td>
          <td>${esc(o.cliente_nome)}</td>
          <td>${o.recebidas}/${o.total_partes}</td>
          <td>${badge(o.status)}</td>
          <td>${tagAtraso(o)}</td>
          <td class="suave">${fmtData(o.aberta_em)}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="suave">Nenhuma OS neste filtro.</td></tr>';
    }

    function tagAtraso(o) {
      if (o.atraso_aberto) return '<span class="tag-atraso">ATRASADA</span>';
      if (o.teve_atraso) return '<span class="tag-atraso-hist">teve atraso</span>';
      return '<span class="suave">—</span>';
    }

    function filtrar(status) {
      document.querySelectorAll('.chip-f').forEach((c) => c.classList.toggle('ativo', c.dataset.s === status));
      listar(status);
    }

    document.getElementById('filtros').addEventListener('click', (e) => {
      if (e.target.classList.contains('chip-f')) filtrar(e.target.dataset.s);
    });

    Promise.all([metricas(), listar('')]).catch((e) => {
      document.getElementById('lista').innerHTML =
        `<tr><td colspan="6"><span class="msg erro">${esc(e.message)}</span></td></tr>`;
    });
  </script>
</body>
</html>
