<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OS — Nuvem Voadora</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <h1>☁️ Nuvem Voadora — HUB</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="recebimento.html">Recebimento</a>
      <a href="separacao.html">Separação</a>
      <a href="atrasos.html">Atrasos</a>
      <a href="nova-os.html">Nova OS</a>
      <a href="lojas.html">Lojas</a>
    </nav>
  </header>
  <main id="conteudo">
    <p class="suave">Carregando…</p>
  </main>

  <script src="app.js"></script>
  <script>
    async function carregar() {
      const codigo = qs('codigo');
      const os = await api('/os/' + encodeURIComponent(codigo));
      const atrasoAberto = os.partes.some((p) => p.atrasada);
      const atraso = atrasoAberto
        ? ' <span class="tag-atraso">ATRASADA</span>'
        : (os.teve_atraso ? ' <span class="tag-atraso-hist">TEVE ATRASO</span>' : '');
      const tagAtrasoParte = (p) => {
        if (p.atrasada) return '<span class="tag-atraso">atraso</span>';
        if (p.recebida_atrasada) return `<span class="tag-atraso-hist">recebida c/ atraso · ${p.dias_atraso}d</span>`;
        return '';
      };
      const partes = os.partes.map((p) => `
        <tr>
          <td><b>${p.letra}</b></td>
          <td>${esc(p.loja_nome)}<div class="suave">${esc(p.loja_cidade_uf || '')}</div></td>
          <td>${badge(p.status)} ${tagAtrasoParte(p)}</td>
          <td class="suave">${fmtDia(p.prazo_limite)}</td>
          <td>${p.itens.map((i) => `${i.quantidade}× ${esc(i.descricao)}`).join('<br>') || '<span class="suave">—</span>'}</td>
          <td><a href="etiqueta.html?codigo=${p.codigo_barras}" target="_blank" class="mono">${p.codigo_barras}</a></td>
        </tr>`).join('');

      document.getElementById('conteudo').innerHTML = `
        <h2 class="mono">${os.codigo} ${badge(os.status)}${atraso}</h2>
        <div class="card">
          <div class="grid">
            <div><div class="l suave">CLIENTE</div><div>${esc(os.cliente_nome)} ${os.cliente_uf ? '/' + esc(os.cliente_uf) : ''}</div></div>
            <div><div class="l suave">PARTES RECEBIDAS</div><div>${os.recebidas}/${os.total_partes}</div></div>
            <div><div class="l suave">ESCANINHO</div><div>${esc(os.escaninho || '—')}</div></div>
            <div><div class="l suave">ABERTA EM</div><div>${fmtData(os.aberta_em)}</div></div>
            ${os.despachada_em ? `<div><div class="l suave">DESPACHADA EM</div><div>${fmtData(os.despachada_em)}</div></div>` : ''}
            ${os.rastreio_postagem ? `<div><div class="l suave">RASTREIO TRANSPORTADORA</div><div class="mono">${esc(os.rastreio_postagem)}</div></div>` : ''}
          </div>
          <p class="suave">Visão do cliente: <a href="rastreio.html?codigo=${os.codigo}" target="_blank" class="mono">rastreio.html?codigo=${os.codigo}</a></p>
        </div>
        ${cardDespacho(os)}
        <div id="msg"></div>
        <div class="card">
          <h2>Partes</h2>
          <table>
            <thead><tr><th>Parte</th><th>Loja</th><th>Status</th><th>Prazo p/ HUB</th><th>Itens</th><th>Código</th></tr></thead>
            <tbody>${partes}</tbody>
          </table>
        </div>`;
      ligarAcoes(os);
    }

    // Fecha o ciclo da OS: despacho (com rastreio da transportadora) e encerramento.
    function cardDespacho(os) {
      if (os.status === 'PRONTA_DESPACHO') return `
        <div class="card">
          <h2>Despachar 📦</h2>
          <div class="linha">
            <div><label>Código de rastreio da transportadora (opcional)</label>
              <input id="rastreio-postagem" class="mono" placeholder="ex.: AA123456789BR"></div>
            <div style="max-width:200px; align-self:flex-end;"><button id="btn-despachar">Despachar pacote</button></div>
          </div>
          <p class="suave">O cliente passa a ver "Enviado" no rastreio público.</p>
        </div>`;
      if (os.status === 'DESPACHADA') return `
        <div class="card">
          <h2>Encerrar</h2>
          <button id="btn-encerrar" class="sec">Confirmar entrega e encerrar OS</button>
        </div>`;
      return '';
    }

    function ligarAcoes(os) {
      const msg = (html) => { document.getElementById('msg').innerHTML = html; };
      const despachar = document.getElementById('btn-despachar');
      if (despachar) despachar.onclick = async () => {
        try {
          await api('/os/' + os.codigo + '/despachar', {
            method: 'POST',
            body: JSON.stringify({ rastreio_postagem: document.getElementById('rastreio-postagem').value || null }),
          });
          carregar();
        } catch (e) { msg(`<div class="msg erro">${esc(e.message)}</div>`); }
      };
      const encerrar = document.getElementById('btn-encerrar');
      if (encerrar) encerrar.onclick = async () => {
        try {
          await api('/os/' + os.codigo + '/encerrar', { method: 'POST' });
          carregar();
        } catch (e) { msg(`<div class="msg erro">${esc(e.message)}</div>`); }
      };
    }
    carregar().catch((e) => {
      document.getElementById('conteudo').innerHTML = `<div class="msg erro">${esc(e.message)}</div>`;
    });
  </script>
</body>
</html>
